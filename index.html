<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCAT Gap Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Plain and simple: white page, Arial, one blue for main actions. */
:root{
  --bg:#ffffff; --panel:#ffffff; --sunk:#f4f5f7; --ink:#111111; --ink-2:#444444; --ink-3:#777777; --line:#e2e2e2;
  --accent:#1a56db; --accent-ink:#ffffff; --accent-soft:#e8effc;
  --no:#c0392b; --no-soft:#fbe9e7; --part:#9a6700; --part-soft:#fbf1d9; --yes:#1e7d46; --yes-soft:#e3f3e9;
  --h0:#f1f1f1; --h1:#fde3d2; --h2:#f8b996; --h3:#ee8a5e; --h4:#d4462f; --hok:#e3f3e9;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --panel:#121212; --sunk:#1e1e1e; --ink:#eeeeee; --ink-2:#bbbbbb; --ink-3:#888888; --line:#2e2e2e;
  --accent:#7aa2f7; --accent-ink:#0d0d0d; --accent-soft:#1d2740;
  --no:#ef8a7a; --no-soft:#3a2220; --part:#e0b452; --part-soft:#362d1c; --yes:#6cc893; --yes-soft:#1b3024;
  --h0:#262626; --h1:#4a2a20; --h2:#7a3a24; --h3:#b04a2c; --h4:#f07a63; --hok:#1b3024; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#121212; --sunk:#1e1e1e; --ink:#eeeeee; --ink-2:#bbbbbb; --ink-3:#888888; --line:#2e2e2e;
  --accent:#7aa2f7; --accent-ink:#0d0d0d; --accent-soft:#1d2740;
  --no:#ef8a7a; --no-soft:#3a2220; --part:#e0b452; --part-soft:#362d1c; --yes:#6cc893; --yes-soft:#1b3024;
  --h0:#262626; --h1:#4a2a20; --h2:#7a3a24; --h3:#b04a2c; --h4:#f07a63; --hok:#1b3024; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 90px}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:1.25rem} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2);font-size:.88rem}
.label{font-size:.75rem;color:var(--ink-3);font-weight:700}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.count{font-size:.85rem;color:var(--ink-2)} .count b{font-size:1rem;color:var(--ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:0;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--ink-2);font:700 .88rem var(--font);padding:10px 12px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
nav.tabs .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:18px;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px} .stack.tight{gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 .85rem var(--font);padding:8px 14px;border-radius:5px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:10px 18px;font-size:.92rem}
.btn.small{padding:4px 10px;font-size:.8rem}
.btn.link{border:0;background:none;padding:2px 0;color:var(--accent);text-decoration:underline}
.btn.danger{color:var(--no);border-color:var(--no)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.notice{background:var(--sunk);border-radius:5px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:700;color:var(--ink-2);min-width:0}
input,select,textarea{font:inherit;font-weight:400;font-size:.92rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
textarea{min-height:60px;resize:vertical}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:.84rem var(--font);padding:6px 11px;border-radius:5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.sugg{border-style:dashed}
.req::after{content:" *";color:var(--no)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.why{font-size:.85rem;color:var(--ink-2)}
.status{display:inline-flex;align-items:center;font:700 .72rem var(--font);border-radius:4px;padding:2px 7px;white-space:nowrap}
.status.no{background:var(--no-soft);color:var(--no)} .status.part{background:var(--part-soft);color:var(--part)} .status.yes{background:var(--yes-soft);color:var(--yes)} .status.plain{background:var(--sunk);color:var(--ink-2)} .status.acc{background:var(--accent-soft);color:var(--accent)}
.list{list-style:none;margin:0;padding:0}
.list>li{padding-block:9px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.list>li:first-child{border-top:0}
.list .main{min-width:0;flex:1}
.qcard{background:var(--sunk);border-radius:5px;padding:12px 14px;white-space:pre-wrap}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px 8px;font:700 .9rem var(--font);cursor:pointer;color:var(--ink)}
.rate button[data-s="no"]{border-color:var(--no);color:var(--no)} .rate button[data-s="partial"]{border-color:var(--part);color:var(--part)} .rate button[data-s="yes"]{border-color:var(--yes);color:var(--yes)}
.rate small{display:block;font-weight:400;color:var(--ink-3);font-size:.74rem}
details>summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink-2);font:700 .8rem var(--font);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.prompt{font-size:.8rem;background:var(--sunk);border-radius:5px;padding:10px;white-space:pre-wrap;max-height:160px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;color:var(--ink-3)}
.tablewrap{overflow-x:auto}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;white-space:pre-wrap;min-width:0}
.meter{height:6px;background:var(--h0);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent)}
.cov{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.cov button{text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.cov button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cat{display:flex;flex-direction:column;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.code{font-size:.75rem;color:var(--accent);font-weight:700}
.heat{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cell{border-radius:4px;padding:6px 8px;font-size:.76rem;line-height:1.25;min-height:46px;border:1px solid transparent;color:var(--ink);text-align:left;font-family:var(--font);cursor:default;background:none}
button.cell{cursor:pointer}
.cell[data-l="u"]{background:repeating-linear-gradient(135deg,var(--h0) 0 6px,transparent 6px 10px);border-color:var(--line);color:var(--ink-3)}
.cell[data-l="0"]{background:var(--hok)}
.cell[data-l="1"]{background:var(--h1)} .cell[data-l="2"]{background:var(--h2)} .cell[data-l="3"]{background:var(--h3);color:#fff} .cell[data-l="4"]{background:var(--h4);color:#fff}
.cell b{display:block;font-weight:400;font-size:.7rem;opacity:.85;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>MCAT Gap Tracker</h1>
    <div class="count"><b class="num" id="daysLeft">–</b> <span id="daysLabel">days to test day</span></div>
  </header>
  <div id="sampleNote" class="notice" hidden>
    <span>Example records. Your first save replaces them.</span>
    <button class="btn small" id="clearSample">Clear</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<button class="btn primary big fab" id="fab">+ Log a question</button>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ================= constants ================= */
const SUBJECTS=["Biology","Biochemistry","General Chemistry","Organic Chemistry","Physics","Psychology","Sociology","Research & stats"];
const SCI_SOURCES=["UWorld","AAMC","Jack Westin","Other"];
const REASONS={gap:"Knowledge gap",mixup:"Confused similar concepts",misread:"Misread stem or figure",calc:"Math or units",time:"Time pressure",other:"Other"};
const REASON_ACTION={
  gap:"Re-learn it from your content source, then write the rule in one sentence from memory.",
  mixup:"Write a two-column contrast of the two concepts you mixed up, then do 2 questions that test the difference.",
  misread:"Do 2 questions on this topic and underline what the stem or figure actually asks before answering.",
  calc:"Redo the calculation with units written on every line, then do 1 similar question.",
  time:"Do 2 timed questions on this topic and note the step where you slowed down.",
  other:"Re-read your note on this question, then do 2 questions on the topic."};
const CARS_SOURCES=["Jack Westin","UWorld","AAMC","JSTOR Daily","Aeon","Other"];
// AAMC CARS content outline: ~50% humanities, ~50% social sciences. "Studies of diverse cultures" can fall in either.
const CARS_DISC={"Humanities":["Architecture","Art","Dance","Ethics","Literature","Music","Philosophy","Popular culture","Religion","Theater","Diverse cultures (humanities)"],
 "Social sciences":["Anthropology","Archaeology","Economics","Education","Geography","History","Linguistics","Political science","Population health","Psychology","Sociology","Diverse cultures (social science)"]};
const CARS_STYLES=["Opinion / argument","Conversational","Factual / scientific","Historical account","Abstract / theoretical"];
const DISC_MIGRATE={"Art & architecture":"Art","Theater & dance":"Theater","Cultural studies":"Diverse cultures (humanities)","Anthropology & archaeology":"Anthropology"};
const discGroup=d=>CARS_DISC["Humanities"].includes(d)?"Humanities":CARS_DISC["Social sciences"].includes(d)?"Social sciences":"";
const CARS_DISC_ALL=Object.values(CARS_DISC).flat();
const CARS_SKILLS=[["Foundations of Comprehension","30%",["Main idea","Detail","Meaning in context","Author's attitude","Paragraph function"]],
 ["Reasoning Within the Text","30%",["Inference","Support for a claim","Argument structure"]],
 ["Reasoning Beyond the Text","40%",["Application","Analogy","Strengthen / weaken"]]];
const CARS_QT=CARS_SKILLS.flatMap(x=>x[2]);
const skillOf=qt=>(CARS_SKILLS.find(x=>x[2].includes(qt))||[""])[0];
const qtChips=(attr,sel,wrap)=>`<div class="stack tight" ${wrap}>${CARS_SKILLS.map(([g,pct,l])=>`<div class="stack tight" style="gap:4px"><span class="muted" style="font-size:.78rem">${g} · ${pct}</span><div class="chips">${l.map(x=>`<button type="button" class="chip" ${attr}="${esc(x)}" aria-pressed="${sel===x}">${esc(x)}</button>`).join("")}</div></div>`).join("")}</div>`;
const CARS_TRAPS={attrib:"Misattributed a viewpoint",scope:"Answer went beyond the passage",detail:"Took a detail as the main idea",extreme:"Fell for extreme wording",qualifier:"Missed a qualifier or negation",wrongq:"True statement, wrong question",other:"Other"};
const TRAP_TASK={
  attrib:"In your next passage, tag every opinion with whose it is (author, critic, cited scholar) before answering.",
  scope:"For each answer you pick, point to the exact line that supports it. No line, no pick.",
  detail:"Before the questions, write the main idea in one sentence. Check main-idea answers against that sentence.",
  extreme:"Circle absolute words (always, never, only) in answer choices and check whether the author is that strong.",
  qualifier:"Underline qualifiers and negations (not, except, some, may) in the stem and the passage as you read.",
  wrongq:"Restate each question in your own words before reading the choices.",
  other:"Re-read your notes on the missed questions and do one timed passage."};
const CARS_SNAGS=["Finding the main idea","Following the argument","Author's view vs. others' views","How paragraphs connect","Long or complex sentences","Unfamiliar words","Abstract topic","Ran out of time"];
const READ_TASKS=["After reading, write one sentence: what is the author arguing against? Then mark two phrases that show the author's attitude.",
 "Label each paragraph's job in five words or fewer (claim, example, counterpoint, concession).",
 "Find one place where the author cites someone else's view. Write whose view it is and whether the author agrees.",
 "Write the main idea in one sentence before re-reading anything, then check it against the last paragraph."];
const SITES=[["Aeon","aeon.co"],["JSTOR Daily","daily.jstor.org"],["Arts & Letters Daily","aldaily.com"],["The Conversation","theconversation.com"],["Psyche","psyche.co"]];
const OUTLINE = {
BB:[
 ["1A","Proteins & amino acids",["Amino acid structure & properties","Protein structure (1°–4°)","Non-enzymatic proteins (binding, motors, antibodies)","Enzyme kinetics (Km, Vmax, Michaelis-Menten)","Enzyme inhibition & regulation","Protein isolation & analysis"]],
 ["1B","Genetic information",["DNA structure & replication","DNA repair & mutation","Transcription & RNA processing","Translation & genetic code","Gene expression regulation (operons, eukaryotic)","Biotechnology (PCR, cloning, blotting, CRISPR)"]],
 ["1C","Heredity & evolution",["Mendelian genetics & pedigrees","Meiosis & genetic variability","Linkage & recombination","Population genetics (Hardy-Weinberg)","Evolution & natural selection"]],
 ["1D","Bioenergetics & metabolism",["Bioenergetics (ΔG, ATP, redox)","Glycolysis & gluconeogenesis","Glycogen & pentose phosphate pathway","Citric acid cycle","Electron transport & oxidative phosphorylation","Fatty acid & lipid metabolism","Amino acid & protein metabolism","Hormonal regulation of metabolism"]],
 ["2A","Cells & membranes",["Plasma membrane & transport","Membrane potential (cell level)","Organelles & cytoskeleton","Tissues (epithelial, connective)"]],
 ["2B","Prokaryotes & viruses",["Bacterial structure & growth","Bacterial genetics (conjugation, transduction)","Viruses & retroviruses","Prions & viroids"]],
 ["2C","Cell division & development",["Cell cycle & mitosis","Cancer & cell cycle control","Embryogenesis & development","Stem cells & differentiation","Apoptosis & aging"]],
 ["3A","Nervous & endocrine",["Neuron & action potential","Synapses & neurotransmitters","Nervous system organization","Sensory receptors","Endocrine glands & hormones","Hormone mechanisms (peptide vs steroid)"]],
 ["3B","Organ systems",["Respiratory system","Cardiovascular system & blood","Lymphatic & immune system","Digestive system","Renal system & excretion","Reproductive system","Muscle system","Skeletal system","Skin"]],
 ["SR","Research & data skills",["Experimental design (BB)","Reading figures & data (BB)"]]
],
CP:[
 ["4A","Motion, forces & energy",["Kinematics","Newton's laws & forces","Friction & inclined planes","Work, energy & power","Momentum & collisions","Torque & equilibrium","Circular motion & gravity"]],
 ["4B","Fluids & gases",["Density & pressure","Buoyancy (Archimedes)","Fluid dynamics (continuity, Bernoulli, Poiseuille)","Gas laws & kinetic theory"]],
 ["4C","Electrostatics & circuits",["Electrostatics (Coulomb, fields, potential)","Circuits (Ohm, resistors, capacitors)","Magnetism","Galvanic & electrolytic cells","Reduction potentials & Nernst"]],
 ["4D","Light, sound & spectroscopy",["Sound & Doppler effect","Wave properties & interference","Geometrical optics (lenses, mirrors)","EM spectrum & photons","IR & UV-Vis spectroscopy","NMR spectroscopy","Mass spectrometry"]],
 ["4E","Atoms & nuclear",["Atomic structure & quantum numbers","Electron configuration","Periodic trends","Nuclear decay & half-life","Photoelectric effect & Bohr model"]],
 ["5A","Water & solutions",["Acids & bases (pH, pKa)","Buffers & titration","Solubility & Ksp","Ions & complex ions","Colligative properties"]],
 ["5B","Molecular structure",["Lewis structures & formal charge","Hybridization & VSEPR","Stereochemistry & isomers","Intermolecular forces","Resonance & molecular orbitals"]],
 ["5C","Separation methods",["Extraction","Distillation","Chromatography","Electrophoresis","Recrystallization"]],
 ["5D","Biological molecules & orgo",["Carbohydrates","Lipids","Amino acids & peptides (chem)","Nucleotides & nucleic acids","Aldehydes & ketones","Alcohols","Carboxylic acids & derivatives","Aromatics & phenols","Substitution reactions (SN1/SN2)"]],
 ["5E","Thermo & kinetics",["Enthalpy, entropy & Gibbs","Equilibrium & Le Châtelier","Rate laws & reaction rates","Catalysts & activation energy","Calorimetry & heat transfer"]],
 ["SR","Research & data skills",["Experimental design (CP)","Units, math & estimation"]]
],
PS:[
 ["6A","Sensing the environment",["Sensory thresholds & signal detection","Vision","Hearing & vestibular sense","Touch, taste & smell"]],
 ["6B","Making sense of the environment",["Attention","Cognitive development (Piaget)","Problem solving & heuristics","Intelligence","Sleep & consciousness","Drugs & altered states","Memory","Language"]],
 ["6C","Responding to the world",["Emotion theories","Stress & coping","Brain regions of emotion (limbic)"]],
 ["7A","Individual influences",["Biology of behavior (brain, neurotransmitters)","Genetics, twin & adoption studies","Personality theories","Psychological disorders","Motivation theories","Attitudes & behavior"]],
 ["7B","Social processes",["Group effects (facilitation, groupthink)","Conformity & obedience","Socialization & norms","Deviance"]],
 ["7C","Learning & attitude change",["Classical conditioning","Operant conditioning","Observational learning","Persuasion (elaboration likelihood)","Cognitive dissonance"]],
 ["8A","Self-identity",["Self-concept & self-esteem","Identity development (Erikson, Kohlberg, Freud)","Social identity"]],
 ["8B","Social thinking",["Attribution theory","Prejudice, bias & stereotypes","Stigma","Perceiving others"]],
 ["8C","Social interactions",["Status & roles","Groups, networks & organizations","Self-presentation","Discrimination","Attraction, aggression & altruism"]],
 ["9A","Social structure",["Sociological theories (functionalism, conflict, symbolic)","Social institutions (family, education, medicine, religion)","Culture & cultural change"]],
 ["9B","Demographics",["Demographic categories (age, race, gender, sexuality)","Migration & immigration","Demographic transition","Urbanization & globalization","Social movements"]],
 ["10A","Social inequality",["Social class & mobility","Poverty","Residential segregation","Health disparities"]],
 ["SR","Research & data skills",["Research methods & study design (PS)","Statistics & data interpretation (PS)"]]
]};
const SECTIONS={BB:"Bio/Biochem",CP:"Chem/Phys",PS:"Psych/Soc"};
const OUT={}; for(const sec in OUTLINE) OUTLINE[sec].forEach(([code,cat,subs])=>subs.forEach((name,i)=>{const id=sec+"-"+code+"-"+i;OUT[id]={id,sec,code,cat,name};}));
const SUBJ_SEC={"Biology":["BB"],"Biochemistry":["BB","CP"],"General Chemistry":["CP"],"Organic Chemistry":["CP"],"Physics":["CP"],"Psychology":["PS"],"Sociology":["PS"],"Research & stats":["PS","BB","CP"]};
// extra words that point to an outline subtopic
const ALIAS={"PS-7C-1":"reinforcement punishment skinner schedule extinction","PS-7C-0":"pavlov unconditioned conditioned stimulus","BB-1A-3":"enzyme kinetics lineweaver","BB-1A-4":"inhibitor inhibition allosteric competitive","CP-5C-2":"chromatography exchange hplc column gel filtration affinity","BB-1A-5":"purification exchange sds page isoelectric","CP-4C-4":"nernst cell potential","CP-5A-1":"henderson hasselbalch buffer titration equivalence","BB-1D-4":"etc atp synthase proton gradient","CP-4D-2":"lens mirror focal magnification refraction snell","PS-9A-0":"functionalism conflict theory symbolic interactionism","BB-3B-4":"nephron kidney glomerulus loop henle","PS-6B-6":"encoding retrieval decay amnesia","PS-8B-0":"fundamental attribution error actor observer"};
const stemTok=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w.length>3&&!["with","from","that","between","versus","system","systems","structure","function"].includes(w)).map(w=>w.replace(/(ies|es|s)$/,""));
function matchOutline(name,subject){
  const toks=stemTok(name); if(!toks.length) return "";
  const secs=SUBJ_SEC[subject]||["BB","CP","PS"]; let best="",bs=0;
  for(const id in OUT){const o=OUT[id]; const hay=new Set(stemTok(o.name+" "+(ALIAS[id]||"")));
    let sc=toks.filter(t=>hay.has(t)).length; if(!sc) continue; if(secs.includes(o.sec)) sc+=0.5; if(secs[0]===o.sec) sc+=0.25;
    if(sc>bs){bs=sc;best=id;}}
  return best;
}
function outlineSelect(id,sel){
  return `<select id="${id}"><option value="">Not on the map</option>${Object.entries(OUTLINE).map(([sec,cats])=>cats.map(([code,cat,subs])=>`<optgroup label="${SECTIONS[sec]} ${code} ${esc(cat)}">${subs.map((n,i)=>{const oid=sec+"-"+code+"-"+i;return `<option value="${oid}" ${oid===sel?"selected":""}>${esc(n)}</option>`;}).join("")}</optgroup>`).join("")).join("")}</select>`;
}
const isContent=it=>!(it.reasons||[]).length||(it.reasons||[]).some(r=>r==="gap"||r==="mixup");
function mapStats(){
  const st={}; for(const id in OUT) st[id]={topics:[],items:0,content:0,w:0,wins:0,last:""};

    S.items.filter(i=>i.topicId===t.id).forEach(i=>{o.items++; if(isContent(i)){o.content++; o.w+=Math.exp(-diffDays(todayS(),i.doneDate)/21);} if(i.doneDate>o.last)o.last=i.doneDate;});
    S.wins.filter(w=>w.topicId===t.id).forEach(w=>{o.wins++; if(w.date>o.last)o.last=w.date;}); });
  for(const id in st){const o=st[id]; o.seen=o.items+o.wins>0; o.lvl=!o.seen?"u":!o.content?"0":o.w<.8?"1":o.w<1.6?"2":o.w<2.5?"3":"4";}

}

const DAY=864e5;
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const todayS=()=>iso(new Date());
const addDays=(s,n)=>iso(new Date(parseD(s).getTime()+n*DAY+3600e3*3)); // +3h guards DST
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/DAY);
const fmtD=s=>s?parseD(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}):"";
const shortD=s=>s?parseD(s).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"";
function weekStartS(s){const d=parseD(s);const k=(d.getDay()+6)%7;return addDays(s,-k);}
function relDue(s){const n=diffDays(s,todayS());return n<0?`overdue ${-n}d`:n===0?"today":n===1?"tomorrow":fmtD(s);}

function dueItems(){const t=todayS();return S.items.filter(it=>it.due&&it.due<=t&&!it.needsNewQ&&it.cards[it.cardIdx]).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:tierOfTopic(a.topicId)-tierOfTopic(b.topicId));}

/* ---- topic priority: still shaky after retest > repeated across questions > first miss ---- */
function topicInfo(id){
  const items=S.items.filter(i=>i.topicId===id);
  const wins=S.wins.filter(w=>w.topicId===id);
  const attempts=items.flatMap(i=>i.attempts.map(a=>({...a,item:i}))).sort((a,b)=>a.date<b.date?-1:1);
  const last=attempts[attempts.length-1]||null;
  const lastMiss=items.map(i=>i.doneDate).sort().pop()||"";
  const winAfter=wins.some(w=>w.date>=lastMiss);
  let tier=3, why="First miss on this topic";
  if(items.some(i=>{const l=lastAttempt(i);return l&&l.self==="no";})){tier=1;why="Still couldn't answer it on a retest";}
  else if(items.length>=2){tier=2;why=`Missed or guessed on ${items.length} different questions`;}
  if(tier===3&&last&&last.self==="yes") {tier=4;why="Answered correctly on the last retest";}
  if(winAfter&&tier>1){tier=5;why="Answered a new question correctly since the last miss";}
  const dues=items.map(i=>i.due).filter(Boolean).sort();
  return {id,items,wins,attempts,last,tier,why,firstDue:dues[0]||"9999",created:items.map(i=>i.created).sort()[0]||""};
}
const tierOfTopic=id=>topicInfo(id).tier;
function priorityTopics(){
  const ids=[...new Set(S.items.map(i=>i.topicId))];
  return ids.map(topicInfo).filter(x=>x.tier<=3).sort((a,b)=>a.tier-b.tier||(a.firstDue<b.firstDue?-1:a.firstDue>b.firstDue?1:0)||(a.created<b.created?-1:1));
}
function evidenceLine(info){
  const rc={};info.items.forEach(i=>(i.reasons||[]).forEach(r=>rc[r]=(rc[r]||0)+1));
  const rs=Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(([k,n])=>REASONS[k]+(n>1?` ×${n}`:"")).join(", ");
  const srcs=info.items.map(srcLabel).filter(Boolean).join(", ");
  const last=info.last?` Last retest: ${SELF[info.last.self].toLowerCase()} (${shortD(info.last.date)}).`:"";
  return `${info.items.length} record${info.items.length>1?"s":""}${rs?" · "+rs:""}${srcs?" · "+srcs:""}.${last}`;
}
function practiceAction(info){
  const withNext=info.items.filter(i=>i.nextTime&&i.nextTime.trim()).sort((a,b)=>a.created<b.created?1:-1)[0];
  if(withNext) return {text:withNext.nextTime.trim(),from:"from your own note"};
  const rc={};info.items.forEach(i=>(i.reasons||[]).forEach(r=>rc[r]=(rc[r]||0)+1));
  const top=Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
  return {text:REASON_ACTION[top?top[0]:"other"],from:top?`because the main reason was "${REASONS[top[0]].toLowerCase()}"`:"default step"};
}

const cqPassage=q=>S.passages.find(p=>p.id===q.passageId);
function trapStats(fromDate){
  const out={};S.cq.filter(q=>!fromDate||q.date>=fromDate).forEach(q=>(q.traps||[]).forEach(t=>{(out[t]=out[t]||{n:0,passages:new Set(),qs:[]});out[t].n++;out[t].qs.push(q);out[t].passages.add(q.passageId||("q"+q.id));}));
  return Object.entries(out).map(([k,o])=>({k,n:o.n,np:o.passages.size,qs:o.qs})).sort((a,b)=>b.np-a.np||b.n-a.n);
}
function discStats(){
  const d={};S.passages.filter(p=>!p.readingOnly).forEach(p=>{const o=d[p.disc]=d[p.disc]||{n:0,min:[],sc:0,of:0,miss:0};o.n++;if(p.minutes)o.min.push(+p.minutes);if(p.outOf){o.sc+=+p.score;o.of+=+p.outOf;}});
  S.cq.forEach(q=>{const p=cqPassage(q);const k=p?p.disc:q.disc;if(k)(d[k]=d[k]||{n:0,min:[],sc:0,of:0,miss:0}).miss++;});
  return Object.entries(d).map(([k,o])=>({k,n:o.n,avgMin:o.min.length?o.min.reduce((a,c)=>a+c,0)/o.min.length:null,pct:o.of?o.sc/o.of:null,miss:o.miss}));
}

/* ================= LOG (science) ================= */
let F=null;
function freshForm(){return {subject:"",topic:"",result:"",source:"",outline:"",outManual:false,reasons:[],thought:"",nextTime:"",rq:"",ra:""};}

    <label class="f"><span class="req">Topic</span><input id="l-topic" autocomplete="off" placeholder="e.g. anion-exchange chromatography" value="${esc(F.topic)}"></label>

    <div class="stack tight"><span class="label req">Result</span><div class="chips" id="l-res"><button type="button" class="chip" data-res="wrong" aria-pressed="${F.result==="wrong"}">Wrong</button><button type="button" class="chip" data-res="guess" aria-pressed="${F.result==="guess"}">Guessed right / 50-50</button></div></div>

      <div class="stack" style="margin-top:10px">
        <div class="fields"><label class="f">Source<select id="l-src"><option value="">Not specified</option>${SCI_SOURCES.map(s=>`<option ${s===F.source?"selected":""}>${s}</option>`).join("")}</select></label></div>
        <div class="stack tight"><span class="label">Why I missed it</span><div class="chips" id="l-rsn">${Object.entries(REASONS).map(([k,l])=>`<button type="button" class="chip" data-rsn="${k}" aria-pressed="${F.reasons.includes(k)}">${l}</button>`).join("")}</div></div>
        <label class="f">What I was thinking<textarea id="l-thought" placeholder="e.g. Thought a negative protein sticks to a negative resin">${esc(F.thought)}</textarea></label>
        <label class="f">How to tell next time<textarea id="l-next" placeholder="e.g. First compare pH and pI to get net charge, then pick the opposite-charge resin">${esc(F.nextTime)}</textarea></label>
      </div></details>
    ${editing?"":`<details id="l-rt" ${full?"open":""}><summary>Retest question</summary>
      <div class="stack" style="margin-top:10px">        <label class="f">Question<textarea id="l-rq" placeholder="e.g. Buffer pH 8.5, protein pI 6.0. Does it bind a DEAE column?">${esc(F.rq)}</textarea></label>
        <label class="f">Answer and short explanation<textarea id="l-ra" placeholder="e.g. Yes. pH > pI, so it's negative and binds the positive DEAE resin.">${esc(F.ra)}</textarea></label></div></details>`}
    <div class="row"><button class="btn primary big" id="l-save">${editing?"Save changes":"Save"}</button>${editing?`<button class="btn" id="l-cancel">Cancel</button>`:`<button class="btn" id="l-clear">Clear</button>`}</div>
  </div>${editing?"":sciLogList()}`;
  if(!F.subject&&recentSubj&&!editing){} // keep explicit choice
  const bindIn=(sel,key)=>{const el=$(sel);if(el)el.oninput=e=>F[key]=e.target.value;};

    const p=e.target.closest("[data-pick]");if(p){const t=topicById(p.dataset.pick);F.topic=t.name;$("#l-topic").value=t.name;F.outline=t.outline||matchOutline(t.name,t.subject);$("#l-out").value=F.outline;if(!F.subject){F.subject=t.subject;$("#l-subj").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.subj===F.subject));}$("#l-sugg").innerHTML="";return;}

}
let logFilter="all";
function sciLogList(){
  const all=S.items.slice().sort((a,b)=>(a.created||a.doneDate)<(b.created||b.doneDate)?1:-1);

    <div class="seg" id="lf">${[["all",`All (${all.length})`],["practice",`Practice (${all.length-nfl})`],["fl",`Full length (${nfl})`]].map(([k,l])=>`<button type="button" data-lf="${k}" aria-pressed="${logFilter===k}">${l}</button>`).join("")}</div></div>
    ${list.length?`<ul class="list">${list.slice(0,40).map(i=>`<li><div class="main"><button class="btn link" data-topic="${i.topicId}" style="font-weight:700;text-align:left">${esc(tname(i.topicId))}</button>
      <div class="muted" style="font-size:.82rem">${shortD(i.doneDate)} · ${esc(i.subject)} · ${i.result==="wrong"?"wrong":"guessed"}${(i.reasons||[]).length?" · "+i.reasons.map(r=>REASONS[r]).join(", "):""}</div>${i.thought?`<div class="sub">${esc(i.thought)}</div>`:""}</div>
      <div class="stack tight" style="align-items:flex-end">${i.flId?`<button class="status acc" data-flid="${i.flId}" style="border:0;cursor:pointer">Full length · ${esc(i.source)}${i.qn?" Q"+esc(i.qn):""}</button>`:i.source?`<span class="status plain">${esc(i.source)}</span>`:""}<button class="btn small" data-edit="${i.id}">Edit</button></div></li>`).join("")}</ul>${list.length>40?`<p class="muted">Showing 40 of ${list.length}. See Records for all.</p>`:""}`:`<p class="muted">Nothing logged yet.</p>`}
  </section>`;
}
function sugg(){
  const q=norm(F.topic), el=$("#l-sugg"); if(!el) return;
  if(!S.topics.length){el.innerHTML="";return;}
  let list=S.topics.map(t=>{const n=norm(t.name);const score=!q?1:n===q?0:n.includes(q)||q.includes(n)?1:q.length>=3&&n.includes(q.slice(0,3))?2:9;return {t,score};}).filter(x=>x.score<9);
  if(F.subject) list.sort((a,b)=>(a.t.subject===F.subject?0:1)-(b.t.subject===F.subject?0:1));
  list.sort((a,b)=>a.score-b.score); list=list.slice(0,5);
  const exact=list.find(x=>x.score===0);
  el.innerHTML=list.length?`<div class="stack tight"><span class="muted" style="font-size:.78rem">${exact?"Matches an existing topic. It will be added there.":q?"Existing topics. Pick one to avoid splitting the same point:":"Your topics:"}</span><div class="chips">${list.map(x=>`<button type="button" class="chip sugg" data-pick="${x.t.id}">${esc(x.t.name)} <span class="muted" style="font-size:.72rem">${esc(x.t.subject)}</span></button>`).join("")}</div></div>`:"";
}
function saveItem(editing){
  if(!F.subject) return toast("Pick a subject.");
  if(!F.topic.trim()) return toast("Add the topic, e.g. anion-exchange chromatography.");
  if(!F.result) return toast("Pick Wrong or Guessed right.");

  if(S.sample&&!editing) leaveSample();

  if(editing){Object.assign(editing,{subject:F.subject,topicId,result:F.result,source:F.source,reasons:F.reasons,thought:F.thought.trim(),nextTime:F.nextTime.trim(),updated:t});
    save();F=null;toast("Record updated.");go("topic",topicId);return;}
  const it={id:uid(),subject:F.subject,topicId,result:F.result,source:F.source,reasons:F.reasons,thought:F.thought.trim(),nextTime:F.nextTime.trim(),doneDate:t,reviewDate:t,created:t,cards:[],cardIdx:0,due:null,needsNewQ:false,attempts:[]};

function addCard(it,q,a){

/* ================= RETEST ================= */
let R=null;
function vRetest(v){
  if(!R){const q=dueItems();R={queue:q.slice(0,3).map(i=>i.id),i:0,stage:"ask",answer:"",results:[]};}
  if(R.i>=R.queue.length){
    const more=dueItems().length;
    v.innerHTML=`<div class="panel stack">${R.queue.length?`<h2>Retest done</h2>
      <ul class="list">${R.results.map(r=>`<li><div class="main"><b>${esc(tname(r.topicId))}</b><div class="muted" style="font-size:.82rem">Next: ${r.needNew?"needs a new question first":fmtD(r.next)}</div></div><span class="status ${SELF_CLS[r.self]}">${SELF[r.self]}</span></li>`).join("")}</ul>`
      :`<div class="empty"><b>Nothing due right now.</b></div>`}
      <div class="row">${more?`<button class="btn primary" id="r-more">Do ${Math.min(3,more)} more (${more} due)</button>`:""}<button class="btn ${more?"":"primary"}" data-go="today">Back to Today</button></div></div>`;

  }
  const it=S.items.find(x=>x.id===R.queue[R.i]); if(!it){R.i++;return vRetest(v);}
  const card=it.cards[it.cardIdx]; const iv=S.settings.iv;
  v.innerHTML=`<div class="panel stack">
    <div class="sec-title"><span class="label">Retest ${R.i+1} of ${R.queue.length}</span><span class="muted" style="font-size:.82rem">${esc(it.subject)}</span></div>
    <h2>${esc(tname(it.topicId))}</h2>
    <div class="qcard">${esc(card.q)}</div>
    ${R.stage==="ask"?`<label class="f">Your answer<textarea id="r-ans">${esc(R.answer)}</textarea></label>
      <div class="row"><button class="btn primary" id="r-submit">Submit answer</button><button class="btn" id="r-show">Show answer</button><button class="btn link" id="r-skip">Skip for now</button></div>`
    :`${R.answer?`<div class="stack tight"><span class="label">Your answer</span><div>${esc(R.answer)}</div></div>`:""}
      <div class="stack tight"><span class="label">Answer</span><div class="qcard" style="background:var(--yes-soft)">${esc(card.a)}</div></div>
      ${it.nextTime?`<div class="why"><b>Your rule:</b> ${esc(it.nextTime)}</div>`:""}
      ${R.stage==="rate"?`<span class="label">How did you do?</span>
      <div class="rate"><button data-s="no">Couldn't<small>again in ${iv.no} day${iv.no>1?"s":""}</small></button><button data-s="partial">Partly<small>again in ${iv.partial} days</small></button><button data-s="yes">Got it<small>new question in ${iv.yes} days</small></button></div>`
      :`<div class="notice" style="margin:0"><span>${R.last.needNew?`Saved as <b>${SELF[R.last.self]}</b>. Next check on ${fmtD(R.last.next)} needs a different question. Add one from the topic page.`:`Saved as <b>${SELF[R.last.self]}</b>. Next retest: <b>${fmtD(R.last.next)}</b>.`}</span></div>
      <div class="row"><button class="btn primary" id="r-next">${R.i+1<R.queue.length?"Next retest":"Finish"}</button>${R.last.needNew?`<button class="btn" id="r-addq">Add a new question now</button>`:""}</div>`}`}
  </div>`;
  if(R.stage==="ask"){
    $("#r-ans").oninput=e=>R.answer=e.target.value;
    $("#r-submit").onclick=()=>{if(!R.answer.trim())return toast("Write an answer first, or use Show answer.");R.stage="rate";vRetest(v);};
    $("#r-show").onclick=()=>{R.stage="rate";vRetest(v);};
    $("#r-skip").onclick=()=>{R.i++;R.stage="ask";R.answer="";vRetest(v);};
  } else if(R.stage==="rate"){
    v.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
      const self=b.dataset.s, t=todayS(), next=addDays(t,iv[self]);
      it.attempts.push({date:t,cardId:card.id,answer:R.answer.trim(),self,next});

      it.due=next; save();
      R.last={self,next,needNew}; R.results.push({topicId:it.topicId,self,next,needNew}); R.stage="saved"; vRetest(v);
      const d=dueItems().length;const btn=document.querySelector('[data-tab="retest"]');if(btn)btn.innerHTML="Retest"+(d?`<span class="dot num">${d}</span>`:"");

    const aq=$("#r-addq");if(aq)aq.onclick=()=>go("topic",{itemId:it.id});
  }
}

function itemCard(it,open){

function carsAnalysis(){
  const timed=S.passages.filter(p=>!p.readingOnly);
  const sn={}; timed.forEach(p=>(p.snags||[]).forEach(x=>sn[x]=(sn[x]||0)+1));
  const snags=Object.entries(sn).sort((a,b)=>b[1]-a[1]);
  const qt={}; S.cq.forEach(q=>qt[q.qtype]=(qt[q.qtype]||0)+1);
  const qtypes=Object.entries(qt).sort((a,b)=>b[1]-a[1]);
  const ds=discStats().filter(d=>d.n>0||d.miss>0).sort((a,b)=>(a.pct??1)-(b.pct??1)||b.miss-a.miss);
  const grp={},sty={};
  timed.forEach(p=>{const g=discGroup(p.disc);if(g&&p.outOf){(grp[g]=grp[g]||{n:0,sc:0,of:0});grp[g].n++;grp[g].sc+=+p.score;grp[g].of+=+p.outOf;}
    (p.styles||[]).forEach(x=>{(sty[x]=sty[x]||{n:0,sc:0,of:0});sty[x].n++;if(p.outOf){sty[x].sc+=+p.score;sty[x].of+=+p.outOf;}});});
  const styles=Object.entries(sty).map(([k,o])=>({k,n:o.n,pct:o.of?o.sc/o.of:null})).sort((a,b)=>(a.pct??1)-(b.pct??1));
  const sk={}; S.cq.forEach(q=>{const g=skillOf(q.qtype);if(g)sk[g]=(sk[g]||0)+1;});
  return {timed,snags,qtypes,ds,traps:trapStats(),grp,styles,sk};
}

  const pick=(v,list)=>{if(!v)return "";const n=String(v).toLowerCase().trim();return list.find(x=>x.toLowerCase()===n)||list.find(x=>x.toLowerCase().startsWith(n)||n.startsWith(x.toLowerCase()))||"";};

  return arr.filter(o=>o&&typeof o==="object").map(o=>{
    const sec=secMap[String(o.sec||o.section||"").toLowerCase().trim()]||"";

    const r={sec,q,result:res,subject:pick(o.subject,SUBJECTS),topic:String(o.topic||"").trim(),note:String(o.note||"").trim(),

}
function impPassages(rows){
  const by={}; rows.filter(r=>r.sec==="CARS"&&r.passage>=1&&r.passage<=12).forEach(r=>{const o=by[r.passage]=by[r.passage]||{qs:0,wrong:0,disc:{}};o.qs++;if(r.result==="wrong")o.wrong++;if(r.disc)o.disc[r.disc]=(o.disc[r.disc]||0)+1;});

function backupHTML(){return `<details class="panel"><summary>Backup and restore</summary><div class="stack" style="margin-top:10px">
  <p class="sub">Data lives in this browser only. Copy a backup to move it to another device.</p>
  <div class="row"><button class="btn" id="s-export">Download backup</button><button class="btn" id="s-copy">Copy backup text</button></div>
  <label class="f">Restore from file<input type="file" id="s-file" accept=".json,application/json"></label>
  <label class="f">Or paste backup text<textarea id="s-paste"></textarea></label><button class="btn small" id="s-import" style="align-self:flex-start">Restore</button></div></details>`;}
function bindBackup(){
  const data=()=>JSON.stringify({app:"mcat-tracker",version:2,exported:new Date().toISOString(),...S});
  $("#s-export").onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data()],{type:"application/json"}));a.download="mcat-tracker-backup-"+todayS()+".json";document.body.appendChild(a);a.click();a.remove();toast("If no file appeared, use Copy backup text.");}catch(e){toast("Download was blocked. Use Copy backup text.");}};
  $("#s-copy").onclick=()=>copy(data(),"Backup copied.");
  const restore=txt=>{try{const o=JSON.parse(txt);
      if(o.version===2||o.items){S=Object.assign(blank(),o);delete S.app;delete S.exported;delete S.version;}
      else if(Array.isArray(o.blocks)){S.legacy.blocks=o.blocks.filter(b=>!b.sample);S.legacy.reads=o.reads||{};}
      else throw 0; S.v=2; save();render();toast("Backup restored.");}catch(e){toast("That doesn't look like a tracker backup.");}};
  $("#s-file").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(fl);};
  $("#s-import").onclick=()=>restore($("#s-paste").value);
}

    <div class="fields"><label class="f">Title<input id="p-title" value="${esc(P.title)}"></label><label class="f">Link<input id="p-url" type="url" value="${esc(P.url)}" placeholder="https://"></label></div>
    <div class="fields" id="p-scorebox" ${P.readingOnly?"hidden":""}><label class="f">Time (min)<input type="number" min="0" step="0.5" id="p-min" value="${esc(P.minutes)}"></label>
      <label class="f">Correct<input type="number" min="0" id="p-score" value="${esc(P.score??"")}" placeholder="3"></label><label class="f">Out of<input type="number" min="1" id="p-of" value="${esc(P.outOf??"")}" placeholder="6"></label></div>
    <div class="stack tight"><span class="label">Where I got stuck</span><div class="chips" id="p-snags">${CARS_SNAGS.map(s=>`<button type="button" class="chip" data-sn="${esc(s)}" aria-pressed="${P.snags.includes(s)}">${esc(s)}</button>`).join("")}</div></div>
    <details ${P.text?"open":""}><summary>Paste the passage</summary><textarea id="p-text" style="margin-top:8px;min-height:140px" placeholder="Paste the full passage text">${esc(P.text||"")}</textarea></details>
    <label class="f">Sentences I didn't understand (one per line)<textarea id="p-hard">${esc(P.hardSentences||"")}</textarea></label>
    <label class="f">${P.readingOnly?"Reading notes":"Notes"} (optional)<textarea id="p-notes" placeholder="e.g. The author argues against… Attitude words: 'naïvely', 'merely'">${esc(P.notes)}</textarea></label>
    <div class="row"><button class="btn primary" id="p-save">${ed?"Save changes":"Save passage"}</button><button class="btn" data-go="cars">Cancel</button>${ed?`<button class="btn danger" id="p-del">Delete…</button><button class="btn danger" id="p-del2" hidden>Delete passage and its questions</button>`:""}</div></div>`;
  bindCommon(v);
  $("#p-ro").onchange=e=>{$("#p-scorebox").hidden=e.target.checked;};
  P.styles=P.styles||[];
  $("#p-disc").onclick=e=>{const c=e.target.closest("[data-d]");if(!c)return;P.disc=c.dataset.d;$("#p-disc").querySelectorAll("[data-d]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.d===P.disc));};
  $("#p-sty").onclick=e=>{const c=e.target.closest("[data-st]");if(!c)return;const k=c.dataset.st;P.styles=P.styles.includes(k)?P.styles.filter(x=>x!==k):[...P.styles,k];c.setAttribute("aria-pressed",P.styles.includes(k));};
  $("#p-snags").onclick=e=>{const c=e.target.closest("[data-sn]");if(!c)return;const s=c.dataset.sn;P.snags=P.snags.includes(s)?P.snags.filter(x=>x!==s):[...P.snags,s];c.setAttribute("aria-pressed",P.snags.includes(s));};
  if(ed){$("#p-del").onclick=()=>{$("#p-del").hidden=true;$("#p-del2").hidden=false;};$("#p-del2").onclick=()=>{S.passages=S.passages.filter(p=>p.id!==ed.id);S.cq=S.cq.filter(q=>q.passageId!==ed.id);save();toast("Passage deleted.");go("cars");};}
  $("#p-save").onclick=()=>{
    const ro=$("#p-ro").checked, sc=$("#p-score").value, of=$("#p-of").value;
    if(!P.disc) return toast("Pick the passage category.");
    if(!ro&&(sc!==""||of!=="")&&(of===""||sc===""||+sc>+of||+sc<0)) return toast("Score should look like 3 out of 6.");
    if(S.sample&&!ed) leaveSample();
    const rec=Object.assign(ed||{id:uid()},{date:ed?ed.date:todayS(),source:$("#p-src").value,title:$("#p-title").value.trim(),url:$("#p-url").value.trim(),disc:P.disc,styles:P.styles,readingOnly:ro,
      minutes:ro?null:(+$("#p-min").value||null),score:ro||sc===""?null:+sc,outOf:ro||of===""?null:+of,snags:P.snags,notes:$("#p-notes").value.trim(),text:$("#p-text").value.trim(),hardSentences:$("#p-hard").value.trim()});
    if(!ed)S.passages.push(rec); save();
    toast(ro?"Reading logged.":"Passage saved."); if(!ro&&!ed) go("logcars",{mode:"q",passageId:rec.id}); else go("cars");
  };
}
function vLogCQ(v,a){
  const ed=a.editId?S.cq.find(q=>q.id===a.editId):null;
  const Q=ed?{...ed,traps:[...(ed.traps||[])]}:{passageId:a.passageId||"",qtype:"",result:"wrong",traps:[],evidence:"",lure:"",date:todayS()};
  const ps=S.passages.filter(p=>!p.readingOnly).sort((x,y)=>x.date<y.date?1:-1).slice(0,15);
  v.innerHTML=`<div class="panel stack">
    <h2>${ed?"Edit CARS question":"Log a CARS question"}</h2>
    <label class="f">Passage<select id="q-p"><option value="">Not linked to a passage</option>${ps.map(p=>`<option value="${p.id}" ${p.id===Q.passageId?"selected":""}>${esc(shortD(p.date)+" · "+(p.title||p.disc)+(p.outOf?` · ${p.score}/${p.outOf}`:""))}</option>`).join("")}</select></label>
    <div class="stack tight"><span class="label req">Question type</span>${qtChips("data-v",Q.qtype,'id="q-qt"')}</div>
    <div class="stack tight"><span class="label req">Result</span><div class="chips" id="q-res"><button type="button" class="chip" data-v="wrong" aria-pressed="${Q.result==="wrong"}">Wrong</button><button type="button" class="chip" data-v="guess" aria-pressed="${Q.result==="guess"}">Guessed right</button></div></div>
    <div class="stack tight"><span class="label">What tripped you (trap)</span><div class="chips" id="q-tr">${Object.entries(CARS_TRAPS).map(([k,l])=>`<button type="button" class="chip" data-v="${k}" aria-pressed="${Q.traps.includes(k)}">${l}</button>`).join("")}</div></div>
    <label class="f">Text that supports the right answer (optional)<textarea id="q-ev" placeholder="e.g. Para 3: 'Some critics insist…' is the critics, not the author">${esc(Q.evidence)}</textarea></label>
    <label class="f">Why the wrong choice pulled me in (optional)<textarea id="q-lure" placeholder="e.g. It reused words from the passage">${esc(Q.lure)}</textarea></label>
    <div class="row"><button class="btn primary" id="q-save">${ed?"Save changes":"Save question"}</button>${ed?"":`<button class="btn" id="q-save2">Save and log another</button>`}<button class="btn" data-go="cars">Done</button>${ed?`<button class="btn danger" id="q-del">Delete</button>`:""}</div></div>`;
  bindCommon(v);
  const single=(sel,key)=>$(sel).onclick=e=>{const c=e.target.closest("[data-v]");if(!c)return;Q[key]=c.dataset.v;$(sel).querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===Q[key]));};
  single("#q-qt","qtype");single("#q-res","result");
  $("#q-tr").onclick=e=>{const c=e.target.closest("[data-v]");if(!c)return;const k=c.dataset.v;Q.traps=Q.traps.includes(k)?Q.traps.filter(x=>x!==k):[...Q.traps,k];c.setAttribute("aria-pressed",Q.traps.includes(k));};
  const doSave=again=>{
    if(!Q.qtype)return toast("Pick the question type.");
    if(S.sample&&!ed)leaveSample();
    const pid=$("#q-p").value; const p=S.passages.find(x=>x.id===pid);
    const rec=Object.assign(ed||{id:uid()},{passageId:pid,qtype:Q.qtype,result:Q.result,traps:Q.traps,evidence:$("#q-ev").value.trim(),lure:$("#q-lure").value.trim(),date:p?p.date:(Q.date||todayS())});
    if(!ed)S.cq.push(rec);save();toast("Question saved.");
    if(again)go("logcars",{mode:"q",passageId:pid});else go("cars");
  };
  $("#q-save").onclick=()=>doSave(false);const s2=$("#q-save2");if(s2)s2.onclick=()=>doSave(true);
  const del=$("#q-del");if(del)del.onclick=()=>{S.cq=S.cq.filter(q=>q.id!==ed.id);save();toast("Deleted.");go("cars");};
}

/* ================= WEEKLY ================= */
let weekOffset=0;
function vWeekly(v){
  const ws=addDays(weekStartS(todayS()),-7*weekOffset), we=addDays(ws,6), nextWs=addDays(ws,7);
  const inW=d=>d>=ws&&d<=we;
  const W=S.weeks[ws]=S.weeks[ws]||{};
  const items=S.items.filter(i=>inW(i.doneDate)), attempts=S.items.flatMap(i=>i.attempts.filter(a=>inW(a.date)).map(a=>({...a,item:i})));
  // Q1: topics missed 2+ times this week, or still not known on a retest this week
  const tmap={};items.forEach(i=>{(tmap[i.topicId]=tmap[i.topicId]||{items:[],bad:[]}).items.push(i);});
  attempts.filter(a=>a.self!=="yes").forEach(a=>{(tmap[a.item.topicId]=tmap[a.item.topicId]||{items:[],bad:[]}).bad.push(a);});
  const q1=Object.entries(tmap).map(([id,o])=>({id,o,score:o.items.length+o.bad.filter(a=>a.self==="no").length*2+o.bad.length})).filter(x=>x.o.items.length>=2||x.o.bad.length).sort((a,b)=>b.score-a.score).slice(0,2);
  // Q2: trap repeated across different passages this week
  const cqW=S.cq.filter(q=>inW(q.date)), pW=S.passages.filter(p=>inW(p.date));
  const tr={};cqW.forEach(q=>(q.traps||[]).forEach(t=>{(tr[t]=tr[t]||{p:new Set(),qs:[]});tr[t].p.add(q.passageId||q.id);tr[t].qs.push(q);}));
  const q2=Object.entries(tr).map(([k,o])=>({k,np:o.p.size,qs:o.qs})).filter(x=>x.np>=2).sort((a,b)=>b.np-a.np)[0];
  // Q3: former weak topics answered correctly on a new question this week
  const q3=S.wins.filter(w=>inW(w.date)&&S.items.some(i=>i.topicId===w.topicId&&i.doneDate<=w.date));
  const total=+W.total||0;
  const cands=[...q1.map(x=>tname(x.id)),q2?`CARS: ${CARS_TRAPS[q2.k]}`:null].filter(Boolean);
  const nextFocus=(S.weeks[nextWs]||{}).focus||"";
  const recLink=i=>`<button class="btn link" data-topic="${i.topicId}">${srcLabel(i)?esc(srcLabel(i))+", ":""}${shortD(i.doneDate)}</button>`;
  v.innerHTML=`<div class="stack" style="gap:16px">
  <div class="row between"><h2>Week of ${shortD(ws)} – ${shortD(we)}</h2><div class="seg"><button type="button" data-wk="1">← Earlier</button><button type="button" data-wk="-1" ${weekOffset===0?"disabled":""}>Later →</button></div></div>
  <p class="sub">This week: ${items.length} question record${items.length===1?"":"s"}, ${attempts.length} retest${attempts.length===1?"":"s"}, ${pW.filter(p=>!p.readingOnly).length} timed passage${pW.filter(p=>!p.readingOnly).length===1?"":"s"}, ${cqW.length} CARS question${cqW.length===1?"":"s"}, ${pW.filter(p=>p.readingOnly).length} article${pW.filter(p=>p.readingOnly).length===1?"":"s"} read.</p>
  <section class="panel stack"><h3>1. Which topics kept costing points, or still weren't known after a retest?</h3>
    ${q1.length?`<ul class="list">${q1.map(x=>`<li><div class="main"><b>${esc(tname(x.id))}</b><div class="sub" style="font-size:.85rem">${x.o.items.length?`${x.o.items.length} miss${x.o.items.length>1?"es":""} this week: ${x.o.items.map(recLink).join(", ")}. `:""}${x.o.bad.length?`Retests not solid: ${x.o.bad.map(a=>`${SELF[a.self].toLowerCase()} on ${shortD(a.date)}`).join(", ")}.`:""}</div></div><button class="btn small" data-topic="${x.id}">Open</button></li>`).join("")}</ul>`
    :`<p class="muted">Not enough yet (${items.length} record${items.length===1?"":"s"}, ${attempts.filter(a=>a.self!=="yes").length} shaky retest${attempts.filter(a=>a.self!=="yes").length===1?"":"s"}).</p>`}</section>
  <section class="panel stack"><h3>2. Which CARS trap showed up in different passages?</h3>
    ${q2?`<div><b>${esc(CARS_TRAPS[q2.k])}</b><div class="sub" style="font-size:.85rem">In ${q2.np} passages: ${q2.qs.map(q=>{const p=cqPassage(q);return esc(`${q.qtype} (${p?(p.title||p.disc)+", "+shortD(p.date):shortD(q.date)})`);}).join("; ")}.</div></div><div class="qcard"><span class="label">Practice</span><br>${esc(TRAP_TASK[q2.k])}</div>`
    :`<p class="muted">No repeat yet (${cqW.length} question${cqW.length===1?"":"s"} from ${new Set(cqW.map(q=>q.passageId).filter(Boolean)).size} passage${new Set(cqW.map(q=>q.passageId).filter(Boolean)).size===1?"":"s"}).</p>
      ${cqW.length?`<ul class="list">${cqW.map(q=>{const p=cqPassage(q);return `<li><div class="main"><b>${esc((q.traps||[]).map(t=>CARS_TRAPS[t]).join(", ")||"No trap tagged")}</b><div class="sub" style="font-size:.85rem">${esc(q.qtype)} · ${q.result==="wrong"?"wrong":"guessed"} · ${esc(p?(p.title||p.disc+" passage")+", "+(p.outOf?p.score+"/"+p.outOf+", ":"")+(p.minutes?p.minutes+" min, ":"")+shortD(p.date):shortD(q.date))}</div>${q.lure?`<div class="muted" style="font-size:.82rem">${esc(q.lure)}</div>`:""}</div><button class="btn small" data-cqedit="${q.id}">Open</button></li>`;}).join("")}</ul>`:""}`}</section>
  <section class="panel stack"><h3>3. Which old weak spot did you get right on a new question?</h3>
    ${q3.length?`<ul class="list">${q3.map(w=>`<li><div class="main"><b>${esc(tname(w.topicId))}</b><div class="sub" style="font-size:.85rem">${esc(srcLabel(w)||"New question")} on ${shortD(w.date)}. Earlier misses: ${S.items.filter(i=>i.topicId===w.topicId).length}.${w.note?" "+esc(w.note):""}</div></div><span class="status yes">Fixed?</span></li>`).join("")}</ul>`
    :`<p class="muted">None this week.</p>`}</section>
  <section class="panel stack"><h3>Totals (optional)</h3>
    <div class="fields"><label class="f">Total questions answered this week<input type="number" min="0" id="w-total" value="${total||""}" placeholder="e.g. 320"></label></div>
    <p class="sub">${total?`You logged ${items.length} review-worthy question${items.length===1?"":"s"} out of ${total} answered (${(items.length/total*100).toFixed(1)}%).`:""}</p></section>
  <section class="panel stack"><h3>Pick next week's priority</h3>
    <div class="chips" id="w-cands">${cands.map(c=>`<button type="button" class="chip" data-focus="${esc(c)}" aria-pressed="${nextFocus===c}">${esc(c)}</button>`).join("")}</div>
    <div class="row"><input id="w-focus" placeholder="Or write your own" value="${esc(nextFocus)}" style="max-width:420px"><button class="btn primary" id="w-fsave">Save priority</button></div>
    </section>
  </div>`;
  bindCommon(v);
  v.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{weekOffset=Math.max(0,weekOffset+(+b.dataset.wk));render();});
  $("#w-total").onchange=e=>{W.total=+e.target.value||0;save();render();};
  $("#w-cands").onclick=e=>{const c=e.target.closest("[data-focus]");if(c)$("#w-focus").value=c.dataset.focus;};
  $("#w-fsave").onclick=()=>{(S.weeks[nextWs]=S.weeks[nextWs]||{}).focus=$("#w-focus").value.trim();save();toast("Saved for next week.");render();};
}

/* ================= RECORDS ================= */
let recTab="q";
function vRecords(v){
  const groups=S.topics.map(t=>({t,info:topicInfo(t.id)})).filter(g=>g.info.items.length||g.info.wins.length).sort((a,b)=>a.info.tier-b.info.tier||a.t.name.localeCompare(b.t.name));
  v.innerHTML=`<div class="stack" style="gap:16px">
   <div class="seg" role="group"><button type="button" data-rt="q" aria-pressed="${recTab==="q"}">Questions (${S.items.length})</button><button type="button" data-rt="c" aria-pressed="${recTab==="c"}">CARS (${S.passages.length})</button><button type="button" data-rt="o" aria-pressed="${recTab==="o"}">Older logs (${S.legacy.blocks.length})</button></div>
   ${recTab==="q"?`<section class="panel stack"><h2>By topic</h2>${groups.length?`<ul class="list">${groups.map(({t,info})=>`<li><div class="main"><button class="btn link" data-topic="${t.id}" style="font-weight:600;text-align:left">${esc(t.name)}</button><div class="muted" style="font-size:.82rem">${esc(t.subject)} · ${info.items.length} record${info.items.length===1?"":"s"}${info.wins.length?` · ${info.wins.length} correct on new questions`:""} · ${esc(info.why)}</div></div>
      <span class="status ${info.tier===1?"no":info.tier===2?"part":info.tier>=4?"yes":"plain"}">${["","Still shaky","Repeated","First miss","Improving","Fixed?"][info.tier]}</span></li>`).join("")}</ul>`:`<div class="empty"><b>No records yet.</b><button class="btn primary" data-go="log">Log a question</button></div>`}</section>`:""}
   ${recTab==="c"?`<section class="panel stack"><h2>CARS passages</h2>${passageList(S.passages.slice().sort((a,b)=>a.date<b.date?1:-1))}${S.cq.filter(q=>!q.passageId).length?`<h3>Questions not linked to a passage</h3><ul class="list">${S.cq.filter(q=>!q.passageId).map(q=>`<li><div class="main">${esc(q.qtype)} · ${esc((q.traps||[]).map(t=>CARS_TRAPS[t]).join(", "))}</div><button class="btn small" data-cqedit="${q.id}">Edit</button></li>`).join("")}</ul>`:""}</section>`:""}
   ${recTab==="o"?`<section class="panel stack"><h2>Older block logs</h2>${S.legacy.blocks.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Source</th><th>Section</th><th>Score</th><th>Missed</th></tr></thead><tbody>${S.legacy.blocks.map(b=>`<tr><td class="num">${shortD(b.date)}</td><td>${esc(b.source)}</td><td>${esc(b.section)}</td><td class="num">${b.correct}/${b.total}</td><td>${(b.misses||[]).length} tagged${(b.misses||[]).some(m=>m.qtype)?": "+esc([...new Set(b.misses.map(m=>m.qtype).filter(Boolean))].join(", ")):""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No older logs.</p>`}</section>`:""}
   ${backupHTML()}
  </div>`;
  bindCommon(v);bindBackup();
  v.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{recTab=b.dataset.rt;render();});
  v.addEventListener("click",e=>{const pe=e.target.closest("[data-pedit]");if(pe)go("logcars",{mode:"passage",editId:pe.dataset.pedit});const qa=e.target.closest("[data-padd]");if(qa)go("logcars",{mode:"q",passageId:qa.dataset.padd});});
}

/* ================= SETTINGS ================= */
let confirmReset=false;
function vSettings(v){
  const iv=S.settings.iv;
  v.innerHTML=`<div class="grid2">
  <section class="panel stack"><h2>Test date and retest spacing</h2>
    <label class="f">Test date<input type="date" id="s-date" value="${esc(S.settings.testDate)}"></label>
    <p class="sub">Days until the next retest.</p>
    <div class="fields"><label class="f">Couldn't<input type="number" min="1" id="s-no" value="${iv.no}"></label><label class="f">Partly<input type="number" min="1" id="s-part" value="${iv.partial}"></label><label class="f">Got it (new question)<input type="number" min="1" id="s-yes" value="${iv.yes}"></label></div>
    <button class="btn primary" id="s-save" style="align-self:flex-start">Save</button></section>
  <section class="panel stack"><h2>Backup</h2>
    <p class="sub">Data lives in this browser only.</p>
    <div class="row"><button class="btn primary" id="s-export">Download backup</button><button class="btn" id="s-copy">Copy backup text</button></div>
    <label class="f">Restore from a backup file<input type="file" id="s-file" accept=".json,application/json"></label>
    <details><summary>Or paste backup text</summary><div class="stack" style="margin-top:8px"><textarea id="s-paste"></textarea><button class="btn small" id="s-import" style="align-self:flex-start">Restore pasted backup</button></div></details></section>
  <section class="panel stack"><h2>Start fresh</h2>
    ${confirmReset?`<div class="row"><button class="btn danger" id="s-yes2">Yes, delete everything</button><button class="btn" id="s-no2">Cancel</button></div>`:`<button class="btn danger" id="s-reset" style="align-self:flex-start">Delete all data…</button>`}</section></div>`;
  $("#s-save").onclick=()=>{S.settings.testDate=$("#s-date").value||"2027-02-12";S.settings.iv={no:Math.max(1,+$("#s-no").value||1),partial:Math.max(1,+$("#s-part").value||2),yes:Math.max(1,+$("#s-yes").value||5)};save();render();toast("Saved.");};
  const data=()=>JSON.stringify({app:"mcat-tracker",version:2,exported:new Date().toISOString(),...S});
  $("#s-export").onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data()],{type:"application/json"}));a.download="mcat-tracker-backup-"+todayS()+".json";document.body.appendChild(a);a.click();a.remove();toast("If no file appeared, use Copy backup text instead.");}catch(e){toast("Download was blocked. Use Copy backup text.");}};
  $("#s-copy").onclick=()=>copy(data(),"Backup copied. Paste it into a note or email to yourself.");
  const restore=txt=>{try{const o=JSON.parse(txt);
      if(o.version===2||o.items){S=Object.assign(blank(),o);delete S.app;delete S.exported;delete S.version;}
      else if(Array.isArray(o.blocks)){S.legacy.blocks=o.blocks.filter(b=>!b.sample);S.legacy.reads=o.reads||{};}
      else throw 0; S.v=2; save();render();toast("Backup restored.");}catch(e){toast("That doesn't look like a tracker backup. Check you copied all of it.");}};
  $("#s-file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f);};
  $("#s-import").onclick=()=>restore($("#s-paste").value);
  if(confirmReset){$("#s-yes2").onclick=()=>{const leg=S.legacy;S=blank();S.legacy=leg;confirmReset=false;save();render();toast("All records deleted.");};$("#s-no2").onclick=()=>{confirmReset=false;render();};}
  else $("#s-reset").onclick=()=>{confirmReset=true;render();};
}

/* ================= boot ================= */
load();
const h0=(location.hash||"").slice(1); if(TABS.some(t=>t[0]===h0)) view=h0;
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(TABS.some(t=>t[0]===k)&&k!==view)go(k);});
if(view==="retest") R=null;
render();
</script>
