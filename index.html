<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCAT Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Calm and minimal: white page, Inter, one accent, thin dividers instead of boxes. */
:root{
  --bg:#ffffff; --panel:#ffffff; --sunk:#f4f5f7; --ink:#111111; --ink-2:#444444; --ink-3:#777777; --line:#e2e2e2;
  --accent:#1a56db; --accent-ink:#ffffff; --accent-soft:#e8effc;
  --no:#c0392b; --no-soft:#fbe9e7; --part:#9a6700; --part-soft:#fbf1d9; --yes:#1e7d46; --yes-soft:#e3f3e9;
  --h0:#f1f1f1; --h1:#fde3d2; --h2:#f8b996; --h3:#ee8a5e; --h4:#d4462f; --hok:#e3f3e9;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --panel:#121212; --sunk:#1e1e1e; --ink:#eeeeee; --ink-2:#bbbbbb; --ink-3:#888888; --line:#2e2e2e;
  --accent:#7aa2f7; --accent-ink:#0d0d0d; --accent-soft:#1d2740;
  --no:#ef8a7a; --no-soft:#3a2220; --part:#e0b452; --part-soft:#362d1c; --yes:#6cc893; --yes-soft:#1b3024;
  --h0:#262626; --h1:#4a2a20; --h2:#7a3a24; --h3:#b04a2c; --h4:#f07a63; --hok:#1b3024; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#121212; --sunk:#1e1e1e; --ink:#eeeeee; --ink-2:#bbbbbb; --ink-3:#888888; --line:#2e2e2e;
  --accent:#7aa2f7; --accent-ink:#0d0d0d; --accent-soft:#1d2740;
  --no:#ef8a7a; --no-soft:#3a2220; --part:#e0b452; --part-soft:#362d1c; --yes:#6cc893; --yes-soft:#1b3024;
  --h0:#262626; --h1:#4a2a20; --h2:#7a3a24; --h3:#b04a2c; --h4:#f07a63; --hok:#1b3024; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 90px}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:1.25rem} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2);font-size:.88rem}
.label{font-size:.75rem;color:var(--ink-3);font-weight:700}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.count{font-size:.85rem;color:var(--ink-2)} .count b{font-size:1rem;color:var(--ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:0;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--ink-2);font:700 .88rem var(--font);padding:10px 12px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
nav.tabs .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:18px;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px} .stack.tight{gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 .85rem var(--font);padding:8px 14px;border-radius:5px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:10px 18px;font-size:.92rem}
.btn.small{padding:4px 10px;font-size:.8rem}
.btn.link{border:0;background:none;padding:2px 0;color:var(--accent);text-decoration:underline}
.btn.danger{color:var(--no);border-color:var(--no)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.notice{background:var(--sunk);border-radius:5px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:700;color:var(--ink-2);min-width:0}
input,select,textarea{font:inherit;font-weight:400;font-size:.92rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
textarea{min-height:60px;resize:vertical}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:.84rem var(--font);padding:6px 11px;border-radius:5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.sugg{border-style:dashed}
.req::after{content:" *";color:var(--no)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.why{font-size:.85rem;color:var(--ink-2)}
.status{display:inline-flex;align-items:center;font:700 .72rem var(--font);border-radius:4px;padding:2px 7px;white-space:nowrap}
.status.no{background:var(--no-soft);color:var(--no)} .status.part{background:var(--part-soft);color:var(--part)} .status.yes{background:var(--yes-soft);color:var(--yes)} .status.plain{background:var(--sunk);color:var(--ink-2)} .status.acc{background:var(--accent-soft);color:var(--accent)}
.list{list-style:none;margin:0;padding:0}
.list>li{padding-block:9px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.list>li:first-child{border-top:0}
.list .main{min-width:0;flex:1}
.qcard{background:var(--sunk);border-radius:5px;padding:12px 14px;white-space:pre-wrap}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px 8px;font:700 .9rem var(--font);cursor:pointer;color:var(--ink)}
.rate button[data-s="no"]{border-color:var(--no);color:var(--no)} .rate button[data-s="partial"]{border-color:var(--part);color:var(--part)} .rate button[data-s="yes"]{border-color:var(--yes);color:var(--yes)}
.rate small{display:block;font-weight:400;color:var(--ink-3);font-size:.74rem}
details>summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink-2);font:700 .8rem var(--font);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.prompt{font-size:.8rem;background:var(--sunk);border-radius:5px;padding:10px;white-space:pre-wrap;max-height:160px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;color:var(--ink-3)}
.tablewrap{overflow-x:auto}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;white-space:pre-wrap;min-width:0}
.meter{height:6px;background:var(--h0);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent)}
.cov{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.cov button{text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.cov button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cat{display:flex;flex-direction:column;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.code{font-size:.75rem;color:var(--accent);font-weight:700}
.heat{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cell{border-radius:4px;padding:6px 8px;font-size:.76rem;line-height:1.25;min-height:46px;border:1px solid transparent;color:var(--ink);text-align:left;font-family:var(--font);cursor:default;background:none}
button.cell{cursor:pointer}
.cell[data-l="u"]{background:repeating-linear-gradient(135deg,var(--h0) 0 6px,transparent 6px 10px);border-color:var(--line);color:var(--ink-3)}
.cell[data-l="0"]{background:var(--hok)}
.cell[data-l="1"]{background:var(--h1)} .cell[data-l="2"]{background:var(--h2)} .cell[data-l="3"]{background:var(--h3);color:#fff} .cell[data-l="4"]{background:var(--h4);color:#fff}
.pics{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pic{position:relative;display:inline-block}
.pic img{width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:zoom-in;display:block;background:var(--sunk)}
.pics.sm{gap:4px}.pics.sm img{width:40px;height:40px}
.pic.missing img{cursor:default}
.pic-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;line-height:1;padding:0;cursor:pointer}
.imgview{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:100;padding:48px 12px 12px}
.imgview img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.imgview button{position:absolute;top:10px;right:12px}
.cell b{display:block;font-weight:400;font-size:.7rem;opacity:.85;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
h1{letter-spacing:-.01em}
.panel{border-radius:10px;padding:20px}
.eyebrow{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.small{font-size:.8rem}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;font:600 .82rem var(--font);color:var(--ink-2);padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;min-width:190px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.menu-pop button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:.88rem;color:var(--ink)}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--sunk)}
.home{display:flex;flex-direction:column;gap:28px;padding-top:8px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .right{text-align:right}
.bignum{font-size:2.6rem;font-weight:700;letter-spacing:-.04em;line-height:1}
.bignum2{font-size:1.6rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.prio{list-style:none;margin:0;padding:0}
.prio li{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.prio li:first-child{border-top:0}
.pn{color:var(--ink-3);font-size:.85rem;width:14px;flex:none;padding-top:2px}
.plink{all:unset;cursor:pointer;font-weight:600;font-size:1rem}
.plink:hover{color:var(--accent)} .plink:focus-visible{outline:2px solid var(--accent)}
.pw{font-size:.82rem;color:var(--ink-3);margin-top:2px}
.pa{font-size:.85rem;color:var(--accent);margin-top:4px}
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem}
.line:last-child{border-bottom:1px solid var(--line)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));gap:8px}
.sc{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;min-width:0}
.sc .v{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.sc.big .v{font-size:1.7rem}
.delta{font-size:.72rem;font-weight:600}.delta.up{color:var(--yes)}.delta.dn{color:var(--no)}
.chart{min-height:60px;overflow:hidden}.chart svg{display:block;max-width:100%}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .tgt{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 4}
.chart .ax{fill:var(--ink-3);font:11px var(--font)}.chart .val{fill:var(--ink);font:600 12px var(--font)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}.chart .ln.dash{stroke-dasharray:5 4}
.chart .dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}.chart .dot.hollow{fill:var(--bg);stroke:var(--accent)}
.chart .pt{cursor:pointer}
.legend .lg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--accent)}.legend .lg.hollow{background:var(--bg);border:2px solid var(--accent);box-sizing:border-box}
.ptxt{font-size:.95rem}
table.hist tbody tr{cursor:pointer}table.hist tbody tr:hover{background:var(--sunk)}
.statusbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.statusbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.statusbar button[aria-pressed="true"]{border-color:var(--ink);}
.statusbar .n{font-size:1.4rem;font-weight:700}
.clist{display:flex;flex-direction:column}
.crow{border-top:1px solid var(--line)} .crow:last-child{border-bottom:1px solid var(--line)}
.crow>summary{list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;cursor:pointer;font-weight:400;color:var(--ink);font-size:.95rem}
.crow>summary::-webkit-details-marker{display:none}
.crow>summary .main{display:flex;flex-direction:column;min-width:0}
.cbody{padding:0 0 14px}
details.panel>summary{font-size:1.05rem;font-weight:700;color:var(--ink)}
details.panel[open]>summary{margin-bottom:12px}
.gaps>li{align-items:flex-start}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.krow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;width:100%}
.sa .grp{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:14px 0 2px}
.sa .it{padding:12px 0;border-bottom:1px solid var(--line)}
.sa .it b{font-weight:700}.sa .it .d{font-size:.92rem;margin-top:3px}.sa .it .a{font-size:.85rem;color:var(--accent);margin-top:3px}
.pill-rec{font-size:.72rem;font-weight:700;color:var(--no);background:var(--no-soft);border-radius:4px;padding:2px 7px;white-space:nowrap}
.tile{background:var(--sunk);border-radius:6px;padding:10px 12px;font-weight:700;font-size:.92rem}
.qrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0}.qrow .main{display:flex;flex-direction:column;min-width:0}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>MCAT Tracker</h1>
    <details class="menu" id="menu"><summary aria-label="More">More</summary><div class="menu-pop"><button data-mgo="weekly">Weekly review</button><button data-mgo="records">All records</button><button data-mgo="settings">Settings and backup</button></div></details>
  </header>
  <div id="sampleNote" class="notice" hidden>
    <span>Example records. Your first save replaces them.</span>
    <button class="btn small" id="clearSample">Clear</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ================= constants ================= */
const SUBJECTS=["Biology","Biochemistry","General Chemistry","Organic Chemistry","Physics","Psychology","Sociology","Research & stats"];
const SCI_SOURCES=["UWorld","AAMC","Jack Westin","Other"];
const REASONS={gap:"Knowledge gap",mixup:"Confused similar concepts",misread:"Misread stem or figure",calc:"Math or units",time:"Time pressure",apply:"Application error",reason:"Reasoning error",other:"Other"};
const REASON_ACTION={
  apply:"Do 3 passage-based questions that use this concept in a new setting.",
  reason:"Redo the missed questions and say why each wrong choice is wrong.",
  gap:"Re-learn it from your content source, then write the rule in one sentence from memory.",
  mixup:"Write a two-column contrast of the two concepts you mixed up, then do 2 questions that test the difference.",
  misread:"Do 2 questions on this topic and underline what the stem or figure actually asks before answering.",
  calc:"Redo the calculation with units written on every line, then do 1 similar question.",
  time:"Do 2 timed questions on this topic and note the step where you slowed down.",
  other:"Re-read your note on this question, then do 2 questions on the topic."};
const CARS_SOURCES=["Jack Westin","UWorld","AAMC","JSTOR Daily","Aeon","Other"];
// AAMC CARS content outline: ~50% humanities, ~50% social sciences. "Studies of diverse cultures" can fall in either.
const CARS_DISC={"Humanities":["Architecture","Art","Dance","Ethics","Literature","Music","Philosophy","Popular culture","Religion","Theater","Diverse cultures (humanities)"],
 "Social sciences":["Anthropology","Archaeology","Economics","Education","Geography","History","Linguistics","Political science","Population health","Psychology","Sociology","Diverse cultures (social science)"]};
const CARS_STYLES=["Opinion / argument","Conversational","Factual / scientific","Historical account","Abstract / theoretical"];
const DISC_MIGRATE={"Art & architecture":"Art","Theater & dance":"Theater","Cultural studies":"Diverse cultures (humanities)","Anthropology & archaeology":"Anthropology"};
const discGroup=d=>d==="Humanities"||d==="Social sciences"?d:CARS_DISC["Humanities"].includes(d)?"Humanities":CARS_DISC["Social sciences"].includes(d)?"Social sciences":"";
const CARS_DISC_ALL=Object.values(CARS_DISC).flat();
const CARS_SKILLS=[["Foundations of Comprehension","30%",["Main idea","Detail","Meaning in context","Author's attitude","Paragraph function"]],
 ["Reasoning Within the Text","30%",["Inference","Support for a claim","Argument structure"]],
 ["Reasoning Beyond the Text","40%",["Application","Analogy","Strengthen / weaken"]]];
const CARS_QT=CARS_SKILLS.flatMap(x=>x[2]);
const skillOf=qt=>(CARS_SKILLS.find(x=>x[0]===qt||x[2].includes(qt))||[""])[0];
const discOpts=sel=>`<option value="">—</option>${Object.entries(CARS_DISC).map(([g,l])=>`<optgroup label="${g}"><option value="${g}" ${sel===g?"selected":""}>${g} (not specified)</option>${l.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("")}</optgroup>`).join("")}`;
const qtChips=(attr,sel,wrap)=>`<div class="stack tight" ${wrap}>${CARS_SKILLS.map(([g,pct,l])=>`<div class="stack tight" style="gap:4px"><span class="muted" style="font-size:.78rem">${g} · ${pct}</span><div class="chips">${l.map(x=>`<button type="button" class="chip" ${attr}="${esc(x)}" aria-pressed="${sel===x}">${esc(x)}</button>`).join("")}</div></div>`).join("")}</div>`;
const CARS_TRAPS={attrib:"Misattributed a viewpoint",scope:"Answer went beyond the passage",detail:"Took a detail as the main idea",extreme:"Fell for extreme wording",qualifier:"Missed a qualifier or negation",wrongq:"True statement, wrong question",other:"Other"};
const TRAP_TASK={
  attrib:"In your next passage, tag every opinion with whose it is (author, critic, cited scholar) before answering.",
  scope:"For each answer you pick, point to the exact line that supports it. No line, no pick.",
  detail:"Before the questions, write the main idea in one sentence. Check main-idea answers against that sentence.",

const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const todayS=()=>iso(new Date());
const addDays=(s,n)=>iso(new Date(parseD(s).getTime()+n*DAY+3600e3*3)); // +3h guards DST
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/DAY);
const fmtD=s=>s?parseD(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}):"";
const shortD=s=>s?parseD(s).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"";

/* ---- topic priority: still shaky after retest > repeated across questions > first miss ---- */
function topicInfo(id){
  const items=S.items.filter(i=>i.topicId===id);
  const wins=S.wins.filter(w=>w.topicId===id);
  const attempts=items.flatMap(i=>i.attempts.map(a=>({...a,item:i}))).sort((a,b)=>a.date<b.date?-1:1);
  const last=attempts[attempts.length-1]||null;
  const lastMiss=items.map(i=>i.doneDate).sort().pop()||"";
  const winAfter=wins.some(w=>w.date>=lastMiss);
  let tier=3, why="First miss on this topic";
  if(items.some(i=>{const l=lastAttempt(i);return l&&l.self==="no";})){tier=1;why="Still couldn't answer it on a retest";}
  else if(items.length>=2){tier=2;why=`Missed or guessed on ${items.length} different questions`;}
  if(tier===3&&last&&last.self==="yes") {tier=4;why="Answered correctly on the last retest";}
  if(winAfter&&tier>1){tier=5;why="Answered a new question correctly since the last miss";}
  const dues=items.map(i=>i.due).filter(Boolean).sort();
  return {id,items,wins,attempts,last,tier,why,firstDue:dues[0]||"9999",created:items.map(i=>i.created).sort()[0]||""};
}
const tierOfTopic=id=>topicInfo(id).tier;
function priorityTopics(){
  const ids=[...new Set(S.items.map(i=>i.topicId))];
  return ids.map(topicInfo).filter(x=>x.tier<=3).sort((a,b)=>a.tier-b.tier||(a.firstDue<b.firstDue?-1:a.firstDue>b.firstDue?1:0)||(a.created<b.created?-1:1));
}
function evidenceLine(info){
  const rc={};info.items.forEach(i=>(i.reasons||[]).forEach(r=>rc[r]=(rc[r]||0)+1));
  const rs=Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(([k,n])=>REASONS[k]+(n>1?` ×${n}`:"")).join(", ");
  const srcs=info.items.map(srcLabel).filter(Boolean).join(", ");
  const last=info.last?` Last retest: ${SELF[info.last.self].toLowerCase()} (${shortD(info.last.date)}).`:"";
  return `${info.items.length} record${info.items.length>1?"s":""}${rs?" · "+rs:""}${srcs?" · "+srcs:""}.${last}`;
}
function practiceAction(info){
  const withNext=info.items.filter(i=>i.nextTime&&i.nextTime.trim()).sort((a,b)=>a.created<b.created?1:-1)[0];
  if(withNext) return {text:withNext.nextTime.trim(),from:"from your own note"};
  const rc={};info.items.forEach(i=>(i.reasons||[]).forEach(r=>rc[r]=(rc[r]||0)+1));
  const top=Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
  return {text:REASON_ACTION[top?top[0]:"other"],from:top?`because the main reason was "${REASONS[top[0]].toLowerCase()}"`:"default step"};
}

}

const IDB={p:null,
  db(){return this.p||(this.p=new Promise((res,rej)=>{try{const r=indexedDB.open("mcat-tracker-img",1);r.onupgradeneeded=()=>r.result.createObjectStore("imgs",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}}));},
  async run(mode,fn){const db=await this.db();return new Promise((res,rej)=>{const t=db.transaction("imgs",mode),q=fn(t.objectStore("imgs"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  put(r){return this.run("readwrite",s=>s.put(r));}, get(id){return this.run("readonly",s=>s.get(id));},
  del(id){return this.run("readwrite",s=>s.delete(id));}, all(){return this.run("readonly",s=>s.getAll());}};
const IMGURL={};
async function shrinkImg(file){
  try{const bmp=await createImageBitmap(file); const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)); return b&&(b.size<file.size||sc<1)?b:file;}catch(e){return file;}
}
async function addImg(file){
  const blob=await shrinkImg(file), id="img"+uid();
  await IDB.put({id,blob,name:file.name||"",created:Date.now()});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  return id;
}

function sugg(){
  const q=norm(F.topic), el=$("#l-sugg"); if(!el) return;
  if(!S.topics.length){el.innerHTML="";return;}
  let list=S.topics.map(t=>{const n=norm(t.name);const score=!q?1:n===q?0:n.includes(q)||q.includes(n)?1:q.length>=3&&n.includes(q.slice(0,3))?2:9;return {t,score};}).filter(x=>x.score<9);
  if(F.subject) list.sort((a,b)=>(a.t.subject===F.subject?0:1)-(b.t.subject===F.subject?0:1));
  list.sort((a,b)=>a.score-b.score); list=list.slice(0,5);
  const exact=list.find(x=>x.score===0);
  el.innerHTML=list.length?`<div class="stack tight"><span class="muted" style="font-size:.78rem">${exact?"Matches an existing topic. It will be added there.":q?"Existing topics. Pick one to avoid splitting the same point:":"Your topics:"}</span><div class="chips">${list.map(x=>`<button type="button" class="chip sugg" data-pick="${x.t.id}">${esc(x.t.name)} <span class="muted" style="font-size:.72rem">${esc(x.t.subject)}</span></button>`).join("")}</div></div>`:"";
}

function backupHTML(){return `<details class="panel"><summary>Backup and restore</summary><div class="stack" style="margin-top:10px">
  <p class="sub">Data lives in this browser only. Copy a backup to move it to another device.</p>
  <div class="row"><button class="btn" id="s-export">Download backup</button><button class="btn" id="s-copy">Copy backup text</button></div>
  <label class="f">Restore from file<input type="file" id="s-file" accept=".json,application/json"></label>
  <label class="f">Or paste backup text<textarea id="s-paste"></textarea></label><button class="btn small" id="s-import" style="align-self:flex-start">Restore</button></div></details>`;}
function bindBackup(){
  let dump=null;imgDump().then(d=>dump=d).catch(()=>dump={});
  const data=()=>{if(!dump&&imgRefs().size){toast("Pictures are still loading. Try again in a second.");throw "wait";}return JSON.stringify({app:"mcat-tracker",version:2,exported:new Date().toISOString(),...S,images:dump||{}});};
  $("#s-export").onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data()],{type:"application/json"}));a.download="mcat-tracker-backup-"+todayS()+".json";document.body.appendChild(a);a.click();a.remove();toast("If no file appeared, use Copy backup text.");}catch(e){if(e!=="wait")toast("Download was blocked. Use Copy backup text.");}};
  $("#s-copy").onclick=()=>{let d;try{d=data();}catch(e){return;}copy(d,"Backup copied.");};
  const restore=txt=>{try{const o=JSON.parse(txt);
      if(o.version===2||o.items){S=Object.assign(blank(),o);delete S.app;delete S.exported;delete S.version;delete S.images;if(o.images)imgRestore(o.images).then(n=>{if(n)render();});S.settings=Object.assign(blank().settings,{outlineV:0},o.settings||{});if(!(S.settings.outlineV>=2))remapOutline();}
      else if(Array.isArray(o.blocks)){S.legacy.blocks=o.blocks.filter(b=>!b.sample);S.legacy.reads=o.reads||{};}
      else throw 0; S.v=2; save();render();toast("Backup restored.");}catch(e){toast("That doesn't look like a tracker backup.");}};
  $("#s-file").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(fl);};
  $("#s-import").onclick=()=>restore($("#s-paste").value);
}

/* ================= WEEKLY ================= */
let weekOffset=0;
function vWeekly(v){
  const ws=addDays(weekStartS(todayS()),-7*weekOffset), we=addDays(ws,6), nextWs=addDays(ws,7);
  const inW=d=>d>=ws&&d<=we;
  const W=S.weeks[ws]=S.weeks[ws]||{};
  const items=S.items.filter(i=>inW(i.doneDate)), attempts=S.items.flatMap(i=>i.attempts.filter(a=>inW(a.date)).map(a=>({...a,item:i})));
  // Q1: topics missed 2+ times this week, or still not known on a retest this week
  const tmap={};items.forEach(i=>{(tmap[i.topicId]=tmap[i.topicId]||{items:[],bad:[]}).items.push(i);});
  attempts.filter(a=>a.self!=="yes").forEach(a=>{(tmap[a.item.topicId]=tmap[a.item.topicId]||{items:[],bad:[]}).bad.push(a);});
  const q1=Object.entries(tmap).map(([id,o])=>({id,o,score:o.items.length+o.bad.filter(a=>a.self==="no").length*2+o.bad.length})).filter(x=>x.o.items.length>=2||x.o.bad.length).sort((a,b)=>b.score-a.score).slice(0,2);

/* ================= CONCEPTS (grouped by AAMC subtopic) ================= */
const ERR={content:"Content gap",application:"Application",reasoning:"Reasoning",calculation:"Calculation",interpretation:"Interpretation",unknown:"Cause unclear"};
const ERR_REASON={content:"gap",application:"apply",reasoning:"reason",calculation:"calc",interpretation:"misread",unknown:""};
const errOf=it=>{const r=it.reasons||[];if(r.includes("calc"))return"calculation";if(r.includes("misread"))return"interpretation";if(r.includes("reason"))return"reasoning";if(r.includes("apply"))return"application";if(r.includes("gap")||r.includes("mixup"))return"content";return"unknown";};
/* evidence label: an imported FL miss names a tested concept, not a confirmed misunderstanding */
const evidOf=it=>{const e=errOf(it);if(e==="unknown"&&(it.reasons||[]).length)return "Confirmed: "+it.reasons.map(r=>(REASONS[r]||r).toLowerCase()).join(", ");if(e==="unknown")return it.flId?"Tested concept · cause not reviewed":"Cause not given";return e==="content"?"Confirmed misunderstanding":`Confirmed ${ERR[e].toLowerCase()} error`;};
const conceptKey=it=>{const t=topicById(it.topicId);return t&&t.outline?t.outline:"t:"+it.topicId;};
const conceptName=k=>k.startsWith("t:")?tname(k.slice(2)):(OUT[k]?OUT[k].name.replace(/\s*\([^)]*\)\s*$/,""):k);
const conceptSubj=c=>{const s={};c.items.forEach(i=>{if(i.subject)s[i.subject]=(s[i.subject]||0)+1;});return (Object.entries(s).sort((a,b)=>b[1]-a[1])[0]||[""])[0];};
const STATUS={weak:["Weak","no"],retestdue:["Retest due","part"],reviewing:["Reviewing","plain"],verified:["Verified","yes"]};
const ctxOf=i=>i.flId?"fl:"+i.flId:"src:"+(i.source||"other");
function concepts(){
  const t=todayS(), by={};
  S.items.forEach(it=>{const k=conceptKey(it);const c=by[k]=by[k]||{k,items:[],wins:[],tids:new Set()};c.items.push(it);c.tids.add(it.topicId);});
  S.wins.forEach(w=>{const k=conceptKey({topicId:w.topicId});if(by[k])by[k].wins.push(w);});
  return Object.values(by).map(c=>{
    const md=i=>i.doneDate||i.created||t;
    const misses=c.items.map(md).sort(), lastMiss=misses[misses.length-1];
    /* outcome events after the last miss decide the status */
    const ev=[...c.items.flatMap(i=>(i.attempts||[]).map(a=>({d:a.date,ts:a.ts,k:a.self==="yes"?"pos":a.self==="no"?"neg":"rev"}))),
      ...c.wins.map(w=>({d:w.date,ts:w.ts,k:"pos"})),...c.items.filter(i=>i.reviewedOn).map(i=>({d:i.reviewedOn,ts:i.reviewedTs,k:"rev"}))].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.ts||0)-(b.ts||0));
    /* same-day tie: a miss logged after the review wins (timestamps exist for new records only) */
    const missTs=Math.max(0,...c.items.filter(i=>md(i)===lastMiss&&i.ts).map(i=>i.ts));
    const after=ev.filter(e=>e.d>lastMiss||(e.d===lastMiss&&(!missTs||(e.ts&&e.ts>missTs)))), lastOut=after.filter(e=>e.k!=="rev").pop();
    const fr=ev[0]||null;
    const missedAgain=!!fr&&c.items.some(i=>md(i)>fr.d||(md(i)===fr.d&&i.ts&&fr.ts&&i.ts>fr.ts));
    const failed=!!lastOut&&lastOut.k==="neg";
    const reviewed=after.find(e=>e.k==="rev");
    const cardDue=c.items.some(i=>i.due&&i.due<=t&&(i.needsNewQ||i.cards[i.cardIdx]));
    let status="weak";
    if(failed) status="weak";
    else if(lastOut&&lastOut.k==="pos") status="verified";
    else if(reviewed) status=cardDue||diffDays(t,reviewed.d)>=2?"retestdue":"reviewing";
    const ctx=new Set(c.items.map(ctxOf)).size;
    const w=c.items.reduce((a,i)=>a+Math.exp(-Math.max(0,diffDays(t,md(i)))/21)*(i.flId?1.25:1),0);
    const qs=c.items.length, recurring=failed||missedAgain;
    const score=w*(1+.35*(qs-1))*(ctx>=2?1.2:1)*(status==="weak"?(recurring?1.6:1):{retestdue:.8,reviewing:.35,verified:.1}[status]);
    const ec={};c.items.forEach(i=>{const e=errOf(i);if(e!=="unknown")ec[e]=(ec[e]||0)+1;});
    const err=(Object.entries(ec).sort((a,b)=>b[1]-a[1])[0]||["unknown"])[0];
    const recent=c.items.filter(i=>diffDays(t,md(i))<=14).length;
    const nfl=new Set(c.items.filter(i=>i.flId).map(i=>i.flId)).size;
    return {k:c.k,items:c.items,wins:c.wins,tids:[...c.tids],status,score,err,lastMiss,recent,qs,failed,missedAgain,recurring,ctx,nfl,cardDue,
      reviewedOn:reviewed?reviewed.d:"",name:conceptName(c.k),code:OUT[c.k]?OUT[c.k].code:"",subject:conceptSubj(c)};
  }).sort((a,b)=>b.score-a.score);
}
/* short evidence line for Today */
function conceptWhy(c){
  const b=[c.recent?`${c.recent} miss${c.recent>1?"es":""} in 2 weeks`:`${c.qs} miss${c.qs>1?"es":""}, last ${shortD(c.lastMiss)}`];
  if(c.nfl) b.push(c.nfl>1?`in ${c.nfl} full lengths`:"seen on a full length");
  else if(c.ctx>=2) b.push("across sources");
  if(c.failed) b.push("retest failed");
  else if(c.missedAgain&&c.status==="weak") b.push("missed again after review");
  else if(c.status==="weak") b.push("not reviewed");
  else if(c.status==="retestdue") b.push("reviewed, not yet retested");
  if(c.err!=="content"&&c.err!=="unknown") b.push(ERR[c.err].toLowerCase()+" errors");
  return b.join(" · ");
}
/* concise description of the weakness itself */
function conceptGap(c){
  const n=c.items.filter(i=>(i.review||i.thought||"").trim()).sort((a,b)=>(a.doneDate||"")<(b.doneDate||"")?1:-1)[0];
  const s=n?(n.review||n.thought).trim().replace(/^Q\d+\s*·\s*/,""):"";
  return s?(s.length>90?s.slice(0,88)+"…":s):(c.err==="unknown"?"Missed on "+(c.nfl?"a full length":"practice")+"; cause not reviewed":ERR[c.err]);
}
function conceptAction(c){
  if(c.status==="verified") return "Keep it in mixed practice";
  if(c.status==="reviewing") return "Retest in a day or two with new questions";
  if(c.status==="retestdue") return c.cardDue?"Do the retention check":"Do 3 new questions on it to confirm";
  if(c.recurring) return "Re-learn it, then do 5 new questions";
  const note=c.items.filter(i=>i.nextTime&&i.nextTime.trim()).sort((a,b)=>a.created<b.created?1:-1)[0];
  if(note) return note.nextTime.trim();
  return {content:"Review the concept, then do 3 new questions",application:"Do 3 passage-based questions on it",reasoning:"Redo the missed questions and say why each wrong choice is wrong",calculation:"Do 5 calculation questions, writing units at each step",interpretation:"Redo the missed questions, restating the stem and figure first",unknown:"Redo the missed questions and note why each one was wrong"}[c.err];
}
function markReviewed(k){const t=todayS(),n=Date.now();S.items.forEach(i=>{if(conceptKey(i)===k){i.reviewedOn=t;i.reviewedTs=n;}});save();}
const SKILL_TEST={"Foundations of Comprehension":.3,"Reasoning Within the Text":.3,"Reasoning Beyond the Text":.4};
const SKILL_SHORT={"Foundations of Comprehension":"Foundations","Reasoning Within the Text":"Reasoning Within","Reasoning Beyond the Text":"Reasoning Beyond"};
const SKILL_TASK={"Foundations of Comprehension":"2 passages: write each paragraph's point in 5 words before the questions","Reasoning Within the Text":"2 passages: for each answer, point to the line that supports it","Reasoning Beyond the Text":"2 passages: before the choices, predict how the new idea affects the author's claim"};
function carsSkillShares(){const sk={};let tot=0;S.cq.forEach(q=>{const g=skillOf(q.qtype);if(g){sk[g]=(sk[g]||0)+1;tot++;}});
  return {tot,rows:Object.keys(SKILL_TEST).map(g=>({g,n:sk[g]||0,share:tot?(sk[g]||0)/tot:0,test:SKILL_TEST[g]})).map(r=>({...r,over:r.share-r.test})).sort((a,b)=>b.over-a.over)};}
function carsFocus(){const s=carsSkillShares();if(s.tot<4)return null;const b=s.rows[0];return b.over>=.08?{...b,task:SKILL_TASK[b.g]}:null;}

const SEC_LABEL={CP:"Chem/Phys",CARS:"CARS",BB:"Bio/Biochem",PS:"Psych/Soc",MIX:"Mixed"};
const CODE_SUBJ=c=>({"1A":"Biochemistry","1D":"Biochemistry","4A":"Physics","4B":"Physics","4C":"Physics","4D":"Physics","4E":"General Chemistry","5A":"General Chemistry","5B":"General Chemistry","5C":"Organic Chemistry","5D":"Organic Chemistry","5E":"General Chemistry","9A":"Sociology","9B":"Sociology","10A":"Sociology"})[c]||(/^[123]/.test(c)?"Biology":/^[678]/.test(c)?"Psychology":"");

function bestOutline(text,secs){
  const toks=stemTok(text).filter(t=>!XSTOP.has(t)); let best="",bs=0;
  for(const id in OUT){const o=OUT[id]; if(secs&&!secs.includes(o.sec)) continue; const sc=outScore(toks,id); if(sc>bs){bs=sc;best=id;}}
  return {id:best,sc:bs,toks};
}
function classifyErr(s){
  if(/calc|math|arithmetic|\bunits?\b|convert|conversion|sig ?fig|algebra|equation|plug|comput|log ?rule|exponent/i.test(s))return"calculation";
  if(/misread|mis-read|read (it |the question )?wrong|graph|figure|table|chart|axis|careless|overlook|didn'?t see|skipped|missed the word|\bexcept\b|\bnot\b.*stem/i.test(s))return"interpretation";
  if(/reason|logic|infer|assum|two answers|narrowed|50\/50|second.?guess|changed my answer|justify|evidence/i.test(s))return"reasoning";
  if(/appl(y|ied|ication)|couldn'?t use|how to use|new context|experiment|in context|connect/i.test(s))return"application";
  if(/forg[oe]t|didn'?t know|don'?t know|did not know|not know|never (learned|knew|seen)|remember|recall|memori|confus|mix(ed)? ?up|definition|unfamiliar|blank(ed)?|weak on|no idea|what .+ (is|are|does)|need to (review|learn)/i.test(s))return"content";
  return"unknown";
}
const cleanConcept=s=>s.replace(/^(i\s+)?(totally\s+|completely\s+|kind of\s+)?(forgot|didn'?t know|did not know|don'?t know|was confused (about|on|by)|confused|mixed up|misread|messed up|couldn'?t (remember|recall|figure out)|wasn'?t sure (about|of)?|unsure (about|of)|need to review|review|weak on|struggled with|missed)\s+/i,"").replace(/^(that|about|the|how|what|on)\s+/i,"").replace(/[.?!,;:]+$/,"").split(/\s+/).slice(0,9).join(" ").trim();
const CARS_QT_KW=[[/main idea|central|thesis|summar/i,"Main idea"],[/detail|paraphras|stated/i,"Detail"],[/meaning|word|phrase|term/i,"Meaning in context"],[/tone|attitude|author.*(think|feel|believe)|opinion/i,"Author's attitude"],[/purpose|function|why the author (mention|include)/i,"Argument structure"],[/infer|deduc|impl/i,"Inference"],[/support|evidence|evaluat/i,"Support for a claim"],[/strength|weaken|challenge|undermin/i,"Strengthen / weaken"],[/analog|example|similar/i,"Analogy"],[/appl|new situation|predict|would the author/i,"Application"]];
const CARS_TRAP_KW=[[/extreme|always|never|absolute/i,"extreme"],[/scope|beyond|outside|too broad/i,"scope"],[/who said|whose view|critic|attribut|author'?s view vs/i,"attrib"],[/detail.*main|too narrow/i,"detail"],[/\bnot\b|except|negat|qualif/i,"qualifier"],[/true but|true statement/i,"wrongq"]];
function extractGaps(text,sec){
  const parts=String(text||"").split(/\n+|;|•|(?<=[.!?])\s+/).map(s=>s.replace(/^[\s\-*\d.)]+/,"").trim()).filter(s=>s.length>3);
  const secs=sec&&sec!=="MIX"&&sec!=="CARS"?[sec]:null;
  return parts.map(s=>{
    const err=classifyErr(s);
    if(sec==="CARS"){const qt=(CARS_QT_KW.find(([r])=>r.test(s))||[0,""])[1];return {kind:"cars",text:s,err,qtype:qt,traps:CARS_TRAP_KW.filter(([r])=>r.test(s)).map(x=>x[1]),on:true};}
    const topic=cleanConcept(s)||s; let m=bestOutline(topic,secs); if(m.sc<1&&secs){const m2=bestOutline(topic,null);if(m2.sc>=1)m=m2;}
    // existing topic with shared words
    let ex=null,exs=0; S.topics.forEach(t=>{const tt=new Set(stemTok(t.name).filter(x=>!XSTOP.has(x)));const sc=m.toks.filter(x=>tt.has(x)).length;if(sc>exs&&(sc>=2||(sc>=1&&tt.size<=2))){exs=sc;ex=t;}});
    const outline=ex&&ex.outline?ex.outline:(m.sc>=1?m.id:"");
    const subject=ex?ex.subject:outline?CODE_SUBJ(OUT[outline].code)||(SEC_SUBJ[OUT[outline].sec]||[""])[0]:(secs?SEC_SUBJ[sec][0]:"Biology");
    const seen=S.items.filter(i=>{const t=topicById(i.topicId);return (ex&&i.topicId===ex.id)||(outline&&t&&t.outline===outline);}).length;

    <span class="muted small">${esc(conceptWhy(c))}</span>

    <ul class="list">${c.items.slice().sort((a,b)=>(a.doneDate||"")<(b.doneDate||"")?1:-1).map(i=>`<li><div class="main">${i.review?`<div>${esc(i.review)}</div>`:i.thought?`<div>${esc(i.thought)}</div>`:`<div>${esc(tname(i.topicId))}</div>`}<div class="muted small">${[shortD(i.doneDate),srcOfItem(i),evidOf(i)].filter(Boolean).map(esc).join(" · ")}</div></div><button class="btn link small" data-topic="${i.topicId}">Open</button></li>`).join("")}</ul>
    ${hist.length?`<span class="label">Review and retests</span><ul class="list">${hist.map(x=>`<li><span>${esc(x.t)}</span><span class="muted small num">${shortD(x.d)}</span></li>`).join("")}</ul>`:""}
    ${c.status==="weak"?`<div class="row"><button class="btn small primary" data-rev="${esc(c.k)}">Mark reviewed</button><span class="muted small">after you've re-learned it</span></div>`:""}
    <span class="label">Retest</span>${retestBox(c.k)}
   </div></details>`;
}
function vHub(v){
  const cs=concepts(), cnt=k=>cs.filter(c=>c.status===k).length, open=viewArg&&viewArg.open;
  v.innerHTML=`<div class="stack" style="gap:24px">
   <div class="statusbar">${Object.keys(STATUS).map(k=>`<button type="button" data-hf="${k}" aria-pressed="${hubF===k}"><span class="num n">${cnt(k)}</span><span class="small">${STATUS[k][0]}</span></button>`).join("")}</div>
   <section class="stack tight">
    <input id="hub-q" type="search" placeholder="Search concepts" value="${esc(hubQ)}" aria-label="Search concepts">
    <div class="sec-title"><h3 class="eyebrow" id="hub-h"></h3>${hubF!=="open"?`<button class="btn link small" data-hf="open">Show all open</button>`:""}</div>
    <div class="clist" id="hub-list"></div>
   </section>
   <details class="panel"><summary>Content map</summary><div id="hub-map" style="margin-top:12px"></div></details>
  </div>`;
  const draw=()=>{const q=hubQ.toLowerCase().trim();
    const list=cs.filter(c=>q?true:hubF==="open"?c.status!=="verified":c.status===hubF).filter(c=>!q||(c.name+" "+c.subject+" "+c.code+" "+c.items.map(i=>tname(i.topicId)+" "+(i.thought||"")).join(" ")).toLowerCase().includes(q));
    $("#hub-h").textContent=q?`${list.length} match${list.length===1?"":"es"}`:hubF==="open"?"Open concepts":STATUS[hubF][0];
    $("#hub-list").innerHTML=list.length?list.map(c=>hubRow(c,open===c.k)).join(""):`<p class="muted">${cs.length?"Nothing here.":"Log a practice session or import a full length to build this list."}</p>`;};
  draw();
  bindCommon(v);
  $("#hub-q").oninput=e=>{hubQ=e.target.value;draw();};
  v.querySelectorAll("[data-hf]").forEach(b=>b.onclick=()=>{hubF=hubF===b.dataset.hf?"open":b.dataset.hf;render();});
  v.addEventListener("click",e=>{const r=e.target.closest("[data-rev]");if(r){markReviewed(r.dataset.rev);toast("Marked reviewed. Retest it in a day or two.");go("hub",{open:r.dataset.rev});}});
  vMap($("#hub-map"));
  if(open){const d=v.querySelector("details.crow[open]");if(d)setTimeout(()=>d.scrollIntoView({block:"start"}),0);}
}

/* ================= boot ================= */
load(); setTimeout(sweepImgs,3000); KNOWN=new Set([...S.items,...S.wins].map(x=>x.id));
const h0=(location.hash||"").slice(1); if(ROUTES.includes(h0)) view=h0;
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(ROUTES.includes(k)&&k!==view)go(k);});
if(view==="retest") R=null;
render();
</script>
